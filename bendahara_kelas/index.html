<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Bendahara Kelas</title>
  <!-- Framework & Fonts -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f0f2f5;
      color: #333;
      margin: 0;
      padding: 0;
    }
    .header-app {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px 20px;
      text-align: center;
      border-radius: 0 0 30px 30px;
    }
    .container {
      max-width: 600px;
      padding: 20px;
    }
    .card {
      border: none;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }
    .btn-primary {
      background: #667eea;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-weight: 600;
    }
    .btn-primary:hover { background: #5a67d8; }
    .nav-pills .nav-link.active { background-color: #764ba2; }
    .nav-pills .nav-link { color: #764ba2; font-weight: 500; font-size: 0.9rem; }
    .hidden { display: none; }
    .pin-input {
      letter-spacing: 10px;
      text-align: center;
      font-size: 1.5rem;
      font-weight: bold;
    }
    .status-badge {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 20px;
    }
    .fade-in {
      animation: fadeIn 0.5s;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="header-app shadow">
    <h3 class="mb-0">💰 E-Bendahara</h3>
    <p class="small opacity-75">Sistem Keuangan Kelas Digital</p>
  </div>

  <div class="container">
    <!-- SECTION LOGIN -->
    <div id="loginSection" class="card p-4 fade-in">
      <div class="text-center mb-4">
        <h5 class="fw-bold">Akses Masuk</h5>
        <p class="text-muted small">Silakan masukkan PIN Anda</p>
      </div>
      <div class="mb-3">
        <input type="password" id="pinInput" class="form-control pin-input" placeholder="••••••" inputmode="numeric" maxlength="6">
      </div>
      <button onclick="login()" id="btnLogin" class="btn btn-primary w-100 shadow-sm">MASUK KE PANEL</button>
    </div>

    <!-- MAIN PANEL -->
    <div id="mainSection" class="hidden fade-in">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
          <small class="text-muted d-block" id="roleLabel"></small>
          <strong id="userNameLabel"></strong>
        </div>
        <button onclick="logoutManual()" class="btn btn-outline-danger btn-sm rounded-pill px-3">Logout</button>
      </div>

      <ul class="nav nav-pills nav-fill mb-3 card p-2 flex-row shadow-sm">
        <li class="nav-item">
          <button class="nav-link active" id="tabInBtn" onclick="showTab('input')">Input</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" id="tabRekapBtn" onclick="loadRekap()">Rekap</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" id="tabTotalBtn" onclick="loadTotalDana()">Total</button>
        </li>
      </ul>

      <!-- TAB INPUT (TABLE MODE) -->
      <div id="tabInput" class="card p-3 shadow-sm">
        <div class="mb-3 border-bottom pb-3">
          <label class="form-label small fw-bold">Pilih Siswa</label>
          <select id="siswaSelect" class="form-select shadow-sm"></select>
        </div>
        
        <table class="table table-sm align-middle">
          <thead class="table-light text-secondary">
            <tr>
              <th class="ps-2">Kategori</th>
              <th style="width: 160px;">Nominal (Rp)</th>
            </tr>
          </thead>
          <tbody id="inputTableBody">
            <!-- Dinamis oleh Script -->
          </tbody>
        </table>
        
        <button onclick="simpanMulti()" id="btnSimpan" class="btn btn-primary w-100 mt-2 shadow-sm">SIMPAN SEMUA</button>
      </div>

      <!-- TAB REKAP -->
      <div id="tabRekap" class="hidden fade-in">
        <div class="card p-0 overflow-hidden shadow-sm">
          <div class="p-3 bg-light border-bottom">
            <h6 class="mb-0 fw-bold text-center">Data Pelunasan (Sisa Bayar)</h6>
          </div>
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0" id="tableRekap" style="font-size: 0.85rem;"></table>
          </div>
        </div>
      </div>

      <!-- TAB TOTAL DANA -->
      <div id="tabTotal" class="hidden fade-in">
        <div id="totalDanaContainer"></div>
      </div>
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyt3p4O8Wbjwlg1ILlq7PMvYUA2na3TWcaMB54PEH11zHw9rBRoKOI4nnTRFz8pdURNZQ/exec";
    const categories = ["KAS", "GALON", "KARTU PELAJAR", "TALI ASIH", "LAIN 1", "LAIN 2"];

    let role = "";
    let namaUser = "";
    let sessionID = "";

    async function callGAS(action, payload = {}) {
      const response = await fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify({ action: action, ...payload })
      });
      const res = await response.json();
      if (res.status === "success") return res.data;
      throw new Error(res.message);
    }

    async function login() {
      const pin = document.getElementById('pinInput').value;
      const btn = document.getElementById('btnLogin');
      if(!pin) return alert("Masukkan PIN!");

      btn.disabled = true;
      btn.innerText = 'Mengecek...';

      try {
        const res = await callGAS("login", { pin: pin });
        if(res) {
          role = res.role;
          namaUser = res.nama;
          sessionID = res.sessionID;
          
          document.getElementById('loginSection').classList.add('hidden');
          document.getElementById('mainSection').classList.remove('hidden');
          document.getElementById('roleLabel').innerText = role;
          document.getElementById('userNameLabel').innerText = namaUser;
          
          initApp();
        } else {
          alert("PIN Salah!");
          btn.disabled = false;
          btn.innerText = 'MASUK KE PANEL';
        }
      } catch (e) {
        alert("Gagal koneksi server!");
        btn.disabled = false;
      }
    }

    async function initApp() {
      // Build Input Table
      let html = "";
      categories.forEach(kat => {
        html += `<tr>
          <td class="ps-2 fw-bold small text-secondary">${kat}</td>
          <td><input type="number" class="form-control form-control-sm iuran-input shadow-sm" data-kat="${kat}" placeholder="0"></td>
        </tr>`;
      });
      document.getElementById('inputTableBody').innerHTML = html;

      // Load Siswa
      try {
        const res = await callGAS("getInitialData");
        let sOpt = res.siswa.map(s => `<option value="${s[0]}">${s[0]}. ${s[1]}</option>`).join('');
        document.getElementById('siswaSelect').innerHTML = sOpt;
      } catch (e) { console.error("Error data awal"); }
    }

    async function simpanMulti() {
      const inputs = document.querySelectorAll('.iuran-input');
      let items = [];
      inputs.forEach(inp => {
        if(inp.value > 0) items.push({ kategori: inp.dataset.kat, jumlah: inp.value });
      });

      if(items.length === 0) return alert("Isi minimal satu nominal!");

      const btn = document.getElementById('btnSimpan');
      btn.disabled = true;
      btn.innerText = "Mengirim...";

      const payload = {
        absen: document.getElementById('siswaSelect').value,
        namaSiswa: document.getElementById('siswaSelect').options[document.getElementById('siswaSelect').selectedIndex].text.split('. ')[1],
        role: role,
        namaUser: namaUser,
        items: items
      };

      try {
        const msg = await callGAS("saveMulti", { data: payload });
        alert(msg);
        inputs.forEach(inp => inp.value = "");
      } catch (e) {
        alert("Gagal simpan!");
      }
      btn.disabled = false;
      btn.innerText = "SIMPAN SEMUA";
    }

    async function loadRekap() {
      showTab('rekap');
      const table = document.getElementById('tableRekap');
      table.innerHTML = '<tr><td class="p-4 text-center">Memuat data...</td></tr>';
      
      try {
        const res = await callGAS("rekap");
        let html = `<thead class="table-light text-nowrap"><tr><th class="ps-3">Siswa</th>`;
        res.kategori.forEach(k => html += `<th class="text-center">${k}</th>`);
        html += `</tr></thead><tbody>`;
        
        res.rekap.forEach(r => {
          html += `<tr><td class="ps-3 fw-bold">${r.nama}<br><small class="text-muted">Absen ${r.absen}</small></td>`;
          res.kategori.forEach(k => {
            let status = r.iuran[k];
            let isLunas = status === "LUNAS";
            html += `<td class="text-center">
              <span class="status-badge ${isLunas ? 'bg-success-subtle text-success' : 'bg-danger-subtle text-danger'}">
                ${status}
              </span>
            </td>`;
          });
          html += `</tr>`;
        });
        table.innerHTML = html + "</tbody>";
      } catch (e) { table.innerHTML = '<tr><td class="p-4 text-center text-danger">Gagal memuat.</td></tr>'; }
    }

    async function loadTotalDana() {
      showTab('total');
      const container = document.getElementById('totalDanaContainer');
      container.innerHTML = '<div class="card p-4 text-center">Memuat saldo...</div>';
      
      try {
        const res = await callGAS("totalDana");
        let html = `<div class="card p-3 shadow-sm"><ul class="list-group list-group-flush">`;
        let grandTotal = 0;
        for(let kat in res) {
          grandTotal += res[kat];
          html += `<li class="list-group-item d-flex justify-content-between align-items-center">
            <span class="text-secondary fw-bold">${kat}</span>
            <span class="fw-bold">Rp${res[kat].toLocaleString()}</span>
          </li>`;
        }
        html += `<li class="list-group-item d-flex justify-content-between align-items-center bg-light">
            <strong class="text-primary">TOTAL SALDO</strong>
            <span class="badge bg-primary fs-6">Rp${grandTotal.toLocaleString()}</span>
          </li></ul></div>`;
        container.innerHTML = html;
      } catch (e) { container.innerHTML = '<div class="card p-4 text-center text-danger">Gagal memuat saldo.</div>'; }
    }

    function showTab(t) {
      document.getElementById('tabInput').classList.toggle('hidden', t !== 'input');
      document.getElementById('tabRekap').classList.toggle('hidden', t !== 'rekap');
      document.getElementById('tabTotal').classList.toggle('hidden', t !== 'total');
      document.getElementById('tabInBtn').classList.toggle('active', t === 'input');
      document.getElementById('tabRekapBtn').classList.toggle('active', t === 'rekap');
      document.getElementById('tabTotalBtn').classList.toggle('active', t === 'total');
    }

    function logoutManual() {
      if (sessionID) callGAS("logout", { sessionID: sessionID });
      location.reload();
    }
  </script>
</body>
</html>
