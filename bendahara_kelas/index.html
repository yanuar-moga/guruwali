<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kas 7H - SMPN 1 Moga</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/all.min.css">
  <style>
    body { background: #0f172a; font-family: 'Segoe UI', sans-serif; color: #fff; padding-bottom: 50px; }
    .hidden { display: none !important; }
    .card { background: #1e293b; border: none; border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.4); color: white; }
    .form-control, .form-select { background: #334155; border: none; color: white; }
    .form-control:focus, .form-select:focus { background: #475569; color: white; box-shadow: 0 0 0 0.25rem rgba(59, 130, 246, 0.25); border: 1px solid #3b82f6; }
    .navbar { background: #1e293b !important; border-bottom: 1px solid #334155; }
    .table-container { background: #1e293b; border-radius: 15px; padding: 20px; margin-top: 20px; }
    .table { color: white; border-color: #334155; }
    .table thead th { background: #334155; color: #cbd5e1; font-size: 11px; text-transform: uppercase; text-align: center; position: sticky; top: 0; }
    .table tbody td { border-color: #334155; vertical-align: middle; font-size: 13px; }
    .badge-lunas { background-color: #22c55e; color: white; padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: bold; }
    .badge-belum { background-color: #ef4444; color: white; padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: bold; }
    #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.9); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
  </style>
</head>
<body>

  <!-- LOADING ANIMATION -->
  <div id="loader" class="hidden">
    <div class="text-center">
      <div class="spinner-border text-warning" role="status"></div>
      <p class="mt-2 text-warning fw-bold" id="loaderText">Menghubungkan ke Server...</p>
    </div>
  </div>

  <!-- HALAMAN LOGIN -->
  <div id="loginPage" class="container" style="max-width: 400px; margin-top: 100px;">
    <div class="card p-4 shadow-lg">
      <div class="text-center mb-4">
        <i class="fas fa-user-shield fa-3x text-warning mb-3"></i>
        <h4 class="fw-bold">KAS KELAS 7H</h4>
        <p class="text-muted small">Masukkan PIN Akses</p>
      </div>
      <input type="password" id="pinInput" class="form-control text-center mb-3" placeholder="••••••" style="font-size: 24px;" inputmode="numeric">
      <button onclick="prosesLogin()" class="btn btn-warning w-100 py-2 fw-bold text-dark">MASUK</button>
    </div>
  </div>

  <!-- DASHBOARD UTAMA -->
  <div id="mainPage" class="hidden">
    <nav class="navbar px-3 sticky-top">
      <span class="navbar-brand mb-0 h1 text-white small"><i class="fas fa-school me-2 text-warning"></i>KAS 7H - SPENSAMO</span>
      <div class="d-flex align-items-center">
        <span id="userDisplay" class="me-3 small text-info fw-bold"></span>
        <button onclick="location.reload()" class="btn btn-outline-danger btn-sm">Keluar</button>
      </div>
    </nav>

    <div class="container-fluid mt-4">
      
      <!-- FORM INPUT (HANYA BENDAHARA) -->
      <div id="inputSection" class="row mb-4 hidden">
        <div class="col-12">
          <div class="card border-0 shadow">
            <div class="card-header bg-success text-white fw-bold py-3">
              <i class="fas fa-plus-circle me-2"></i>INPUT PEMBAYARAN
            </div>
            <div class="card-body">
              <div class="row g-2">
                <div class="col-md-4">
                  <label class="small mb-1">Nama Siswa</label>
                  <select id="siswaSelect" class="form-select"></select>
                </div>
                <div class="col-md-3">
                  <label class="small mb-1">Jenis Iuran</label>
                  <select id="jenisSelect" class="form-select">
                    <option value="KAS_KELAS">KAS KELAS</option>
                    <option value="GALON">GALON</option>
                    <option value="KARTU_PELAJAR">KARTU PELAJAR</option>
                    <option value="TALI_ASIH">TALI ASIH</option>
                    <option value="OTHER">LAINNYA</option>
                  </select>
                </div>
                <div class="col-md-3">
                  <label class="small mb-1">Nominal (Rp)</label>
                  <input type="number" id="jumlahInput" class="form-control" placeholder="Contoh: 5000">
                </div>
                <div class="col-md-2 d-flex align-items-end">
                  <button onclick="simpanKeSheet()" class="btn btn-success w-100 fw-bold">SIMPAN</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- TABEL REKAP -->
      <div class="row">
        <div class="col-12">
          <div class="card table-container">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h6 class="mb-0 fw-bold"><i class="fas fa-table me-2 text-info"></i>REKAPITULASI</h6>
              <div class="input-group w-50">
                <span class="input-group-text bg-dark border-0"><i class="fas fa-search text-muted small"></i></span>
                <input type="text" id="cariSiswa" class="form-control form-control-sm" placeholder="Cari nama..." onkeyup="filter()">
              </div>
            </div>
            <div class="table-responsive">
              <table class="table table-hover" id="tabelRekap">
                <thead></thead>
                <tbody id="isiTabel">
                  <tr><td colspan="20" class="text-center py-4 text-muted small">Memuat data rekap...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function toggleLoad(s, text = "Memproses...") { 
      document.getElementById('loaderText').innerText = text;
      document.getElementById('loader').classList[s ? 'remove' : 'add']('hidden'); 
    }

    // 1. FUNGSI LOGIN
    function prosesLogin() {
      const pin = document.getElementById('pinInput').value.trim();
      if(!pin) { alert("PIN tidak boleh kosong!"); return; }
      
      toggleLoad(true, "Memverifikasi PIN...");

      google.script.run
        .withSuccessHandler(res => {
          if(res.status === "success") {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('mainPage').classList.remove('hidden');
            document.getElementById('userDisplay').innerText = res.user;

            // Cek apakah user adalah Bendahara
            if(res.role === "BENDAHARA") {
              document.getElementById('inputSection').classList.remove('hidden');
              loadSiswa();
            }
            loadRekap();
          } else {
            toggleLoad(false);
            alert("GAGAL: " + res.message);
          }
        })
        .withFailureHandler(e => { 
          toggleLoad(false); 
          alert("Error Koneksi: " + e.message); 
        })
        .checkLogin(pin);
    }

    // 2. AMBIL DAFTAR SISWA (HANYA BENDAHARA)
    function loadSiswa() {
      google.script.run.withSuccessHandler(list => {
        const s = document.getElementById('siswaSelect');
        s.innerHTML = '<option value="" disabled selected>-- Pilih Siswa --</option>';
        list.forEach(n => s.innerHTML += `<option value="${n}">${n}</option>`);
      }).getSiswaList();
    }

    // 3. SIMPAN DATA
    function simpanKeSheet() {
      const data = {
        nama: document.getElementById('siswaSelect').value,
        jenis: document.getElementById('jenisSelect').value,
        jumlah: document.getElementById('jumlahInput').value,
        user: document.getElementById('userDisplay').innerText
      };
      
      if(!data.nama || !data.jumlah) { alert("Lengkapi Nama dan Nominal!"); return; }
      
      toggleLoad(true, "Menyimpan Data...");
      google.script.run.withSuccessHandler(res => {
        if(res === "success") {
          alert("Data Berhasil Disimpan!");
          document.getElementById('jumlahInput').value = "";
          loadRekap(); // Refresh tabel
        } else { 
          toggleLoad(false);
          alert("Gagal Simpan: " + res); 
        }
      }).simpanIuran(data);
    }

    // 4. LOAD TABEL REKAP
    function loadRekap() {
      google.script.run.withSuccessHandler(data => {
        const thead = document.querySelector('#tabelRekap thead');
        const tbody = document.querySelector('#tabelRekap tbody');
        
        if(!data || data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="text-center">Data kosong</td></tr>';
          toggleLoad(false);
          return;
        }

        // Header
        thead.innerHTML = `<tr>${data[0].map(h => `<th>${h}</th>`).join('')}</tr>`;
        
        // Body
        let html = "";
        for(let i = 1; i < data.length; i++) {
          html += `<tr>`;
          data[i].forEach((cell, idx) => {
            if(cell === "LUNAS") {
              html += `<td class="text-center"><span class="badge-lunas">LUNAS</span></td>`;
            } else if(cell === "BELUM") {
              html += `<td class="text-center"><span class="badge-belum">BELUM</span></td>`;
            } else if(!isNaN(cell) && cell !== "" && idx !== 0) {
              html += `<td class="text-end fw-bold text-warning">Rp ${Number(cell).toLocaleString('id-ID')}</td>`;
            } else {
              html += `<td class="${idx === 0 ? 'fw-bold text-info' : ''}">${cell}</td>`;
            }
          });
          html += `</tr>`;
        }
        tbody.innerHTML = html;
        toggleLoad(false);
      }).getRekapData();
    }

    // 5. FITUR CARI NAMA
    function filter() {
      const val = document.getElementById("cariSiswa").value.toUpperCase();
      const tr = document.getElementById("isiTabel").getElementsByTagName("tr");
      for (let i = 0; i < tr.length; i++) {
        const td = tr[i].getElementsByTagName("td")[0];
        if (td) tr[i].style.display = td.innerText.toUpperCase().indexOf(val) > -1 ? "" : "none";
      }
    }

    // ENTER UNTUK LOGIN
    document.getElementById('pinInput').addEventListener('keypress', e => { 
      if(e.key === 'Enter') prosesLogin(); 
    });
  </script>
</body>
</html>
