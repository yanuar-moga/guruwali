<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kas 7H - SMPN 1 Moga</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/all.min.css">
  <style>
    body { background: #0f172a; font-family: 'Segoe UI', sans-serif; color: #fff; padding-bottom: 50px; }
    .hidden { display: none !important; }
    .card { background: #1e293b; border: none; border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.4); color: white; }
    .form-control, .form-select { background: #334155; border: none; color: white; }
    .form-control:focus, .form-select:focus { background: #475569; color: white; box-shadow: 0 0 0 0.25rem rgba(59, 130, 246, 0.25); border: 1px solid #3b82f6; }
    .navbar { background: #1e293b !important; border-bottom: 1px solid #334155; }
    .table-container { background: #1e293b; border-radius: 15px; padding: 20px; margin-top: 20px; }
    .table { color: white; border-color: #334155; }
    .table thead th { background: #334155; color: #cbd5e1; font-size: 11px; text-transform: uppercase; text-align: center; }
    .table tbody td { border-color: #334155; vertical-align: middle; font-size: 13px; }
    .badge-lunas { background-color: #22c55e; color: white; padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: bold; }
    .badge-belum { background-color: #ef4444; color: white; padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: bold; }
    #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.9); z-index: 9999; display: flex; justify-content: center; align-items: center; }
  </style>
</head>
<body>

  <div id="loader" class="hidden">
    <div class="text-center">
      <div class="spinner-border text-warning" role="status"></div>
      <p class="mt-2 text-warning fw-bold">Menghubungkan ke Server...</p>
    </div>
  </div>

  <!-- LOGIN -->
  <div id="loginPage" class="container" style="max-width: 400px; margin-top: 100px;">
    <div class="card p-4">
      <div class="text-center mb-4">
        <i class="fas fa-key fa-3x text-warning mb-3"></i>
        <h4 class="fw-bold">KAS KELAS 7H</h4>
        <p class="text-muted small">Masukkan PIN Wali Kelas / Bendahara</p>
      </div>
      <input type="password" id="pinInput" class="form-control text-center mb-3" placeholder="••••••" style="font-size: 24px;">
      <button onclick="prosesLogin()" class="btn btn-warning w-100 py-2 fw-bold">MASUK</button>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="mainPage" class="hidden">
    <nav class="navbar px-3 sticky-top">
      <span class="navbar-brand mb-0 h1 text-white small"><i class="fas fa-school me-2"></i>7H - SPENSAMO</span>
      <div class="d-flex align-items-center">
        <span id="userDisplay" class="me-3 small text-info"></span>
        <button onclick="location.reload()" class="btn btn-outline-danger btn-sm">Keluar</button>
      </div>
    </nav>

    <div class="container-fluid mt-4">
      <!-- FORM BENDAHARA -->
      <div id="inputSection" class="row mb-4 hidden">
        <div class="col-12">
          <div class="card border-0 shadow">
            <div class="card-header bg-success text-white fw-bold">
              <i class="fas fa-plus-circle me-1"></i> INPUT IURAN
            </div>
            <div class="card-body">
              <div class="row g-2">
                <div class="col-md-4">
                  <select id="siswaSelect" class="form-select"></select>
                </div>
                <div class="col-md-3">
                  <select id="jenisSelect" class="form-select">
                    <option value="GALON">GALON</option>
                    <option value="KARTU_PELAJAR">KARTU PELAJAR</option>
                    <option value="TALI_ASIH">TALI ASIH</option>
                    <option value="KAS_KELAS">KAS KELAS</option>
                  </select>
                </div>
                <div class="col-md-3">
                  <input type="number" id="jumlahInput" class="form-control" placeholder="Nominal Rp">
                </div>
                <div class="col-md-2">
                  <button onclick="simpanKeSheet()" class="btn btn-success w-100 fw-bold">SIMPAN</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- REKAP DATA -->
      <div class="row">
        <div class="col-12">
          <div class="card table-container">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h6 class="mb-0 fw-bold">REKAPITULASI IURAN</h6>
              <input type="text" id="cariSiswa" class="form-control form-control-sm w-50" placeholder="Cari nama..." onkeyup="filter()">
            </div>
            <div class="table-responsive">
              <table class="table table-hover" id="tabelRekap">
                <thead></thead>
                <tbody id="isiTabel"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function toggleLoad(s) { document.getElementById('loader').classList[s ? 'remove' : 'add']('hidden'); }

    function prosesLogin() {
      const pin = document.getElementById('pinInput').value;
      if(!pin) return;
      toggleLoad(true);

      google.script.run
        .withSuccessHandler(res => {
          toggleLoad(false);
          if(res.status === "success") {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('mainPage').classList.remove('hidden');
            document.getElementById('userDisplay').innerText = res.user;

            if(res.role === "BENDAHARA") {
              document.getElementById('inputSection').classList.remove('hidden');
              loadSiswa();
            }
            loadRekap();
          } else {
            alert(res.message);
          }
        })
        .withFailureHandler(e => { toggleLoad(false); alert(e.message); })
        .checkLogin(pin);
    }

    function loadSiswa() {
      google.script.run.withSuccessHandler(list => {
        const s = document.getElementById('siswaSelect');
        s.innerHTML = '<option value="">-- Pilih Siswa --</option>';
        list.forEach(n => s.innerHTML += `<option value="${n}">${n}</option>`);
      }).getSiswaList();
    }

    function simpanKeSheet() {
      const data = {
        nama: document.getElementById('siswaSelect').value,
        jenis: document.getElementById('jenisSelect').value,
        jumlah: document.getElementById('jumlahInput').value,
        user: document.getElementById('userDisplay').innerText
      };
      if(!data.nama || !data.jumlah) return alert("Lengkapi data!");
      
      toggleLoad(true);
      google.script.run.withSuccessHandler(res => {
        toggleLoad(false);
        if(res === "success") {
          alert("Berhasil!");
          document.getElementById('jumlahInput').value = "";
          loadRekap();
        } else { alert("Gagal: " + res); }
      }).simpanIuran(data);
    }

    function loadRekap() {
      google.script.run.withSuccessHandler(data => {
        const thead = document.querySelector('#tabelRekap thead');
        const tbody = document.querySelector('#tabelRekap tbody');
        
        thead.innerHTML = `<tr>${data[0].map(h => `<th>${h}</th>`).join('')}</tr>`;
        
        let html = "";
        for(let i = 1; i < data.length; i++) {
          html += `<tr>`;
          data[i].forEach((cell, idx) => {
            if(cell === "LUNAS") html += `<td class="text-center"><span class="badge-lunas">LUNAS</span></td>`;
            else if(cell === "BELUM") html += `<td class="text-center"><span class="badge-belum">BELUM</span></td>`;
            else if(!isNaN(cell) && cell !== "" && idx !== 0) html += `<td class="text-end">Rp ${Number(cell).toLocaleString('id-ID')}</td>`;
            else html += `<td>${cell}</td>`;
          });
          html += `</tr>`;
        }
        tbody.innerHTML = html;
      }).getRekapData();
    }

    function filter() {
      const val = document.getElementById("cariSiswa").value.toUpperCase();
      const tr = document.getElementById("isiTabel").getElementsByTagName("tr");
      for (let i = 0; i < tr.length; i++) {
        const td = tr[i].getElementsByTagName("td")[0];
        if (td) tr[i].style.display = td.innerText.toUpperCase().indexOf(val) > -1 ? "" : "none";
      }
    }

    document.getElementById('pinInput').addEventListener('keypress', e => { if(e.key === 'Enter') prosesLogin(); });
  </script>
</body>
</html>
