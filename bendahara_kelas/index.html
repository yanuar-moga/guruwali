<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Kas & Rekap 7H</title>
  
  <!-- CSS Pendukung -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/all.min.css">
  
  <style>
    body { background: #0f172a; font-family: 'Segoe UI', sans-serif; color: #fff; padding-bottom: 50px; }
    .hidden { display: none !important; }
    
    /* Login Card Custom Style */
    .login-container { max-width: 400px; margin-top: 100px; }
    .card { background: #1e293b; border: none; border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.4); color: white; }
    .form-control, .form-select { background: #334155; border: none; color: white; }
    .form-control:focus, .form-select:focus { background: #334155; color: white; box-shadow: 0 0 0 0.25rem rgba(59, 130, 246, 0.25); }
    
    /* Navbar & Table Style */
    .navbar { background: #1e293b !important; border-bottom: 1px solid #334155; }
    .table-container { background: #1e293b; border-radius: 15px; padding: 20px; margin-top: 20px; }
    .table { color: white; border-color: #334155; }
    .table thead th { background: #334155; color: #cbd5e1; border: none; }
    .table tbody td { border-color: #334155; vertical-align: middle; }
    
    /* Badges */
    .badge-lunas { background-color: #22c55e; color: white; padding: 5px 12px; border-radius: 20px; font-size: 11px; }
    .badge-belum { background-color: #ef4444; color: white; padding: 5px 12px; border-radius: 20px; font-size: 11px; }
    
    #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.9); z-index: 9999; display: flex; justify-content: center; align-items: center; }
  </style>
</head>
<body>

  <!-- Loading Screen -->
  <div id="loader" class="hidden">
    <div class="text-center">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="mt-2">Memproses...</p>
    </div>
  </div>

  <!-- HALAMAN LOGIN -->
  <div id="loginPage" class="container login-container">
    <div class="card p-4">
      <div class="text-center mb-4">
        <i class="fas fa-shield-alt fa-3x text-warning mb-3"></i>
        <h4>SISTEM KAS 7H</h4>
        <p class="text-muted">Masukkan PIN Akses</p>
      </div>
      <input type="password" id="pin" class="form-control mb-3 text-center" placeholder="••••" style="font-size: 24px;">
      <button onclick="doLogin()" id="btnLogin" class="btn btn-warning w-100 py-2 fw-bold">MASUK</button>
    </div>
  </div>

  <!-- HALAMAN UTAMA (REKAP & INPUT) -->
  <div id="mainPage" class="hidden">
    <nav class="navbar px-3 sticky-top">
      <span class="navbar-brand mb-0 h1 text-white small"><i class="fas fa-university me-2"></i>KAS KELAS 7H</span>
      <div class="d-flex align-items-center">
        <span id="userDisplay" class="me-3 small fw-bold text-info"></span>
        <button onclick="logout()" class="btn btn-outline-danger btn-sm fw-bold">LOGOUT</button>
      </div>
    </nav>

    <div class="container-fluid mt-4">
      
      <!-- FORM INPUT (Hanya Tampil Jika Role BENDAHARA) -->
      <div id="inputSection" class="row mb-4 hidden">
        <div class="col-12">
          <div class="card shadow">
            <div class="card-header bg-success text-white fw-bold">
              <i class="fas fa-plus-circle me-2"></i>INPUT PEMBAYARAN
            </div>
            <div class="card-body">
              <div class="row g-3">
                <div class="col-md-4">
                  <label class="form-label small fw-bold">Nama Siswa</label>
                  <select id="siswaSelect" class="form-select"></select>
                </div>
                <div class="col-md-3">
                  <label class="form-label small fw-bold">Kategori</label>
                  <select id="jenisSelect" class="form-select">
                    <option value="GALON">GALON</option>
                    <option value="KARTU_PELAJAR">KARTU PELAJAR</option>
                    <option value="TALI_ASIH">TALI ASIH</option>
                    <option value="KAS_KELAS">KAS KELAS</option>
                    <option value="OTHER">LAINNYA</option>
                  </select>
                </div>
                <div class="col-md-3">
                  <label class="form-label small fw-bold">Nominal (Rp)</label>
                  <input type="number" id="jumlahInput" class="form-control" placeholder="5000">
                </div>
                <div class="col-md-2 d-flex align-items-end">
                  <button onclick="simpanData()" class="btn btn-success w-100 fw-bold">SIMPAN</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- TABEL REKAP (Tampil untuk Semua Role) -->
      <div class="row">
        <div class="col-12">
          <div class="card table-container">
            <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
              <h6 class="mb-0 fw-bold"><i class="fas fa-list me-2 text-primary"></i>REKAPITULASI PEMBAYARAN</h6>
              <div class="input-group" style="max-width: 300px;">
                <span class="input-group-text bg-dark border-0"><i class="fas fa-search text-muted"></i></span>
                <input type="text" id="cariSiswa" class="form-control" placeholder="Cari nama..." onkeyup="filterTable()">
              </div>
            </div>
            
            <div class="table-responsive">
              <table class="table table-hover" id="tabelRekap">
                <thead></thead>
                <tbody>
                  <tr><td colspan="10" class="text-center py-5 text-muted">Memuat data...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    function showLoader(v) { document.getElementById('loader').classList[v ? 'remove' : 'add']('hidden'); }

    // 1. LOGIN
    function doLogin() {
      const pin = document.getElementById('pin').value;
      if(!pin) return alert("Masukkan PIN!");
      
      showLoader(true);
      google.script.run.withSuccessHandler(res => {
        showLoader(false);
        if(res.status === "success") {
          document.getElementById('loginPage').classList.add('hidden');
          document.getElementById('mainPage').classList.remove('hidden');
          document.getElementById('userDisplay').innerText = "Halo, " + res.user;
          
          // Jika Bendahara, munculkan form input dan load daftar siswa
          if(res.role === "BENDAHARA") {
            document.getElementById('inputSection').classList.remove('hidden');
            loadSiswaList();
          }
          // Semua role load rekap
          loadRekapData();
        } else {
          alert("PIN Salah atau Terjadi Kesalahan!");
        }
      }).checkLogin(pin);
    }

    // 2. LOAD LIST SISWA (Hanya Bendahara)
    function loadSiswaList() {
      google.script.run.withSuccessHandler(list => {
        const sel = document.getElementById('siswaSelect');
        sel.innerHTML = '<option value="" disabled selected>Pilih Siswa...</option>';
        list.forEach(s => sel.innerHTML += `<option value="${s}">${s}</option>`);
      }).getSiswaList();
    }

    // 3. SIMPAN DATA (Hanya Bendahara)
    function simpanData() {
      const data = {
        nama: document.getElementById('siswaSelect').value,
        jenis: document.getElementById('jenisSelect').value,
        jumlah: document.getElementById('jumlahInput').value,
        user: document.getElementById('userDisplay').innerText.replace("Halo, ", "")
      };
      
      if(!data.nama || !data.jumlah) return alert("Lengkapi Nama dan Jumlah!");
      
      showLoader(true);
      google.script.run.withSuccessHandler(res => {
        showLoader(false);
        if(res === "success") {
          alert("Data Berhasil Disimpan!");
          document.getElementById('jumlahInput').value = "";
          loadRekapData(); // Refresh tabel setelah simpan
        } else {
          alert("Gagal menyimpan data.");
        }
      }).simpanIuran(data);
    }

    // 4. LOAD TABEL REKAP (Universal)
    function loadRekapData() {
      google.script.run.withSuccessHandler(data => {
        const thead = document.querySelector('#tabelRekap thead');
        const tbody = document.querySelector('#tabelRekap tbody');
        
        // Header
        thead.innerHTML = `<tr class="text-center">${data[0].map(h => `<th>${h}</th>`).join('')}</tr>`;
        
        // Isi Tabel
        let bodyHtml = "";
        for(let i = 1; i < data.length; i++) {
          bodyHtml += `<tr>`;
          data[i].forEach((cell, idx) => {
            if(cell === "LUNAS") {
              bodyHtml += `<td class="text-center"><span class="badge-lunas">LUNAS</span></td>`;
            } else if(cell === "BELUM") {
              bodyHtml += `<td class="text-center"><span class="badge-belum">BELUM</span></td>`;
            } else if(!isNaN(cell) && cell !== "" && idx !== 0) {
              bodyHtml += `<td class="text-end">Rp ${Number(cell).toLocaleString('id-ID')}</td>`;
            } else {
              bodyHtml += `<td>${cell}</td>`;
            }
          });
          bodyHtml += `</tr>`;
        }
        tbody.innerHTML = bodyHtml;
      }).getRekapData();
    }

    // 5. FITUR CARI
    function filterTable() {
      const input = document.getElementById("cariSiswa").value.toUpperCase();
      const rows = document.querySelector("#tabelRekap tbody").getElementsByTagName("tr");
      for (let i = 0; i < rows.length; i++) {
        const td = rows[i].getElementsByTagName("td")[0];
        if (td) {
          const txt = td.textContent || td.innerText;
          rows[i].style.display = txt.toUpperCase().indexOf(input) > -1 ? "" : "none";
        }
      }
    }

    function logout() {
      location.reload(); // Refresh halaman untuk reset session
    }
  </script>
</body>
</html>
