<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Bendahara Kelas</title>
  <!-- Framework & Fonts -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f0f2f5;
      color: #333;
      margin: 0;
      padding: 0;
    }
    .header-app {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px 20px;
      text-align: center;
      border-radius: 0 0 30px 30px;
    }
    .container {
      max-width: 600px;
      padding: 20px;
    }
    .card {
      border: none;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }
    .btn-primary {
      background: #667eea;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-weight: 600;
    }
    .btn-primary:hover { background: #5a67d8; }
    .nav-pills .nav-link.active { background-color: #764ba2; }
    .nav-pills .nav-link { color: #764ba2; font-weight: 500; }
    .hidden { display: none; }
    .pin-input {
      letter-spacing: 10px;
      text-align: center;
      font-size: 1.5rem;
      font-weight: bold;
    }
    .status-badge {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 20px;
    }
    /* Animasi sederhana */
    .fade-in {
      animation: fadeIn 0.5s;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="header-app shadow">
    <h3 class="mb-0">💰 E-Bendahara</h3>
    <p class="small opacity-75">Sistem Keuangan Kelas Digital</p>
  </div>

  <div class="container">
    <!-- SECTION LOGIN -->
    <div id="loginSection" class="card p-4 fade-in">
      <div class="text-center mb-4">
        <h5 class="fw-bold">Akses Masuk</h5>
        <p class="text-muted small">Silakan masukkan PIN Anda</p>
      </div>
      <div class="mb-3">
        <input type="password" id="pinInput" class="form-control pin-input" placeholder="••••••" inputmode="numeric" maxlength="6">
      </div>
      <button onclick="login()" id="btnLogin" class="btn btn-primary w-100 shadow-sm">MASUK KE PANEL</button>
    </div>

    <!-- MAIN PANEL -->
    <div id="mainSection" class="hidden fade-in">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
          <small class="text-muted d-block" id="roleLabel"></small>
          <strong id="userNameLabel"></strong>
        </div>
        <button onclick="logoutManual()" class="btn btn-outline-danger btn-sm rounded-pill px-3">Logout</button>
      </div>

      <ul class="nav nav-pills nav-fill mb-3 card p-2 flex-row shadow-sm">
        <li class="nav-item">
          <button class="nav-link active" id="tabInBtn" onclick="showTab('input')">Input Data</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" id="tabRekapBtn" onclick="loadRekap()">Rekapitulasi</button>
        </li>
      </ul>

      <!-- TAB INPUT -->
      <div id="tabInput" class="card p-4 shadow-sm">
        <div class="mb-3">
          <label class="form-label small fw-bold">Pilih Siswa</label>
          <select id="siswaSelect" class="form-select shadow-sm"></select>
        </div>
        <div class="mb-3">
          <label class="form-label small fw-bold">Kategori Iuran</label>
          <select id="katSelect" class="form-select shadow-sm"></select>
        </div>
        <div class="mb-3">
          <label class="form-label small fw-bold">Nominal Pembayaran</label>
          <div class="input-group shadow-sm">
            <span class="input-group-text">Rp</span>
            <input type="number" id="jumlahInput" class="form-control" placeholder="Contoh: 5000">
          </div>
        </div>
        <button onclick="simpan()" id="btnSimpan" class="btn btn-primary w-100 mt-2">SIMPAN TRANSAKSI</button>
      </div>

      <!-- TAB REKAP -->
      <div id="tabRekap" class="hidden fade-in">
        <div class="card p-0 overflow-hidden shadow-sm">
          <div class="p-3 bg-light border-bottom">
            <h6 class="mb-0 fw-bold text-center">Data Pelunasan (Sisa Bayar)</h6>
          </div>
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0" id="tableRekap" style="font-size: 0.85rem;">
              <!-- Data Loading -->
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // URL Web App GAS Anda
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyt3p4O8Wbjwlg1ILlq7PMvYUA2na3TWcaMB54PEH11zHw9rBRoKOI4nnTRFz8pdURNZQ/exec";

    let role = "";
    let namaUser = "";
    let sessionID = "";

    // Fungsi Bridge ke Google Apps Script
    async function callGAS(action, payload = {}) {
      const response = await fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify({ action: action, ...payload })
      });
      const res = await response.json();
      if (res.status === "success") return res.data;
      throw new Error(res.message);
    }

    async function login() {
      const pin = document.getElementById('pinInput').value;
      const btn = document.getElementById('btnLogin');
      if(!pin) return alert("PIN tidak boleh kosong!");

      btn.disabled = true;
      btn.innerHTML = 'Mengecek...';

      try {
        const res = await callGAS("login", { pin: pin });
        if(res) {
          role = res.role;
          namaUser = res.nama;
          sessionID = res.sessionID;
          
          document.getElementById('loginSection').classList.add('hidden');
          document.getElementById('mainSection').classList.remove('hidden');
          document.getElementById('roleLabel').innerText = role;
          document.getElementById('userNameLabel').innerText = namaUser;
          
          initApp();
        } else {
          alert("PIN Salah atau Tidak Terdaftar!");
          btn.disabled = false;
          btn.innerText = 'MASUK KE PANEL';
        }
      } catch (e) {
        alert("Gagal terhubung ke Server!");
        btn.disabled = false;
        btn.innerText = 'MASUK KE PANEL';
      }
    }

    async function initApp() {
      try {
        const res = await callGAS("getInitialData");
        let sOpt = res.siswa.map(s => `<option value="${s[0]}">${s[0]}. ${s[1]}</option>`).join('');
        let kOpt = res.target.map(k => `<option value="${k[0]}">${k[0]}</option>`).join('');
        document.getElementById('siswaSelect').innerHTML = sOpt;
        document.getElementById('katSelect').innerHTML = kOpt;
      } catch (e) { console.error("Gagal ambil data awal"); }
    }

    async function simpan() {
      const data = {
        absen: document.getElementById('siswaSelect').value,
        namaSiswa: document.getElementById('siswaSelect').options[document.getElementById('siswaSelect').selectedIndex].text.split('. ')[1],
        kategori: document.getElementById('katSelect').value,
        jumlah: document.getElementById('jumlahInput').value,
        role: role,
        namaUser: namaUser
      };
      
      if(!data.jumlah) return alert("Isi nominal!");
      
      const btn = document.getElementById('btnSimpan');
      btn.disabled = true;
      btn.innerText = "Mengirim...";

      try {
        const msg = await callGAS("save", { data: data });
        alert(msg);
        document.getElementById('jumlahInput').value = "";
      } catch (e) {
        alert("Gagal menyimpan data!");
      }
      btn.disabled = false;
      btn.innerText = "SIMPAN TRANSAKSI";
    }

    async function loadRekap() {
      showTab('rekap');
      const table = document.getElementById('tableRekap');
      table.innerHTML = '<tr><td colspan="5" class="p-4 text-center">Menghitung data...</td></tr>';
      
      try {
        const res = await callGAS("rekap");
        let html = `<thead class="table-light"><tr><th class="ps-3">Siswa</th>`;
        res.kategori.forEach(k => html += `<th class="text-center">${k}</th>`);
        html += `</tr></thead><tbody>`;
        
        res.rekap.forEach(r => {
          html += `<tr><td class="ps-3 fw-bold">${r.nama}<br><small class="text-muted">Absen ${r.absen}</small></td>`;
          res.kategori.forEach(k => {
            let status = r.iuran[k];
            let isLunas = status === "LUNAS";
            html += `<td class="text-center">
              <span class="status-badge ${isLunas ? 'bg-success-subtle text-success' : 'bg-danger-subtle text-danger'}">
                ${status}
              </span>
            </td>`;
          });
          html += `</tr>`;
        });
        table.innerHTML = html + "</tbody>";
      } catch (e) {
        table.innerHTML = '<tr><td class="p-4 text-center text-danger">Gagal memuat rekap.</td></tr>';
      }
    }

    function showTab(t) {
      document.getElementById('tabInput').classList.toggle('hidden', t !== 'input');
      document.getElementById('tabRekap').classList.toggle('hidden', t !== 'rekap');
      document.getElementById('tabInBtn').classList.toggle('active', t === 'input');
      document.getElementById('tabRekapBtn').classList.toggle('active', t === 'rekap');
    }

    function logoutManual() {
      if (sessionID) callGAS("logout", { sessionID: sessionID });
      location.reload();
    }

    window.addEventListener('beforeunload', () => {
      if (sessionID) callGAS("logout", { sessionID: sessionID });
    });
  </script>
</body>
</html>
