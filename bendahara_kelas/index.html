<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbyKNBJl0DghHMSjW-I7BcqjVncZQlO-_UwcLqAJUcL-_R_FuIYUReTaSaRmMNEpimnQ/exec";

let TARGET = [];
let DASHBOARD = {};

let LOGIN_NAME = "";
let LOGIN_ROLE = "";
let LOGIN_USER = "";

async function postData(data){

  const res = await fetch(API_URL,{

    method:"POST",

    body:JSON.stringify(data)

  });

  return await res.json();

}

function popup(text){

  const div =
    document.createElement("div");

  div.className = "popup";

  div.innerHTML = text;

  document.body.appendChild(div);

  setTimeout(()=>{

    div.remove();

  },2500);

}

function clearSession(){

  localStorage.removeItem(
    "eb_session"
  );

  localStorage.removeItem(
    "eb_role"
  );

  localStorage.removeItem(
    "eb_nama"
  );

  localStorage.removeItem(
    "eb_user"
  );

}

document
.getElementById("pin")
.addEventListener(
  "keypress",
  function(e){

    if(e.key === "Enter"){

      login();

    }

  }
);

window.onload = async function(){

  const sessionId =
    localStorage.getItem(
      "eb_session"
    );

  if(!sessionId){
    return;
  }

  await restoreSession(
    sessionId
  );

};

async function restoreSession(sessionId){

  try{

    const res = await postData({

      action:"restoreSession",

      sessionId:sessionId

    });

    if(!res.success){

      clearSession();
      return;

    }

    LOGIN_NAME = res.nama;
    LOGIN_ROLE = res.role;
    LOGIN_USER = res.user;

    localStorage.setItem(
      "eb_session",
      res.sessionId
    );

    localStorage.setItem(
      "eb_role",
      res.role
    );

    localStorage.setItem(
      "eb_nama",
      res.nama
    );

    localStorage.setItem(
      "eb_user",
      res.user
    );

    if(res.role == "SISWA"){

      await loadSiswaDashboard(
        res.user
      );

      return;

    }

    document
      .getElementById("loginPage")
      .classList.add("hidden");

    document
      .getElementById("adminPage")
      .classList.remove("hidden");

    document
      .getElementById("namaAdmin")
      .innerHTML = LOGIN_NAME;

    document
      .getElementById("roleText")
      .innerHTML = LOGIN_USER;

    await loadDashboard();

  }catch(err){

    clearSession();

  }

}

async function login(){

  const pin =
    document
    .getElementById("pin")
    .value
    .trim();

  if(pin == ""){

    popup("PIN wajib diisi");
    return;

  }

  const res = await postData({

    action:"login",

    pin:pin

  });

  if(!res.success){

    popup(res.message);
    return;

  }

  LOGIN_NAME = res.nama;
  LOGIN_ROLE = res.role;
  LOGIN_USER = res.user;

  localStorage.setItem(
    "eb_session",
    res.sessionId
  );

  localStorage.setItem(
    "eb_role",
    res.role
  );

  localStorage.setItem(
    "eb_nama",
    res.nama
  );

  localStorage.setItem(
    "eb_user",
    res.user
  );

  if(res.role == "SISWA"){

    await loadSiswaDashboard(
      res.user
    );

    popup("Login berhasil");

    return;

  }

  document
    .getElementById("loginPage")
    .classList.add("hidden");

  document
    .getElementById("adminPage")
    .classList.remove("hidden");

  document
    .getElementById("namaAdmin")
    .innerHTML = LOGIN_NAME;

  document
    .getElementById("roleText")
    .innerHTML = LOGIN_USER;

  await loadDashboard();

  popup("Login berhasil");

}

async function loadDashboard(){

  const res = await postData({

    action:"getDashboard"

  });

  if(!res.success){

    popup("Gagal load dashboard");
    return;

  }

  DASHBOARD = res;
  TARGET = res.target;

  renderSiswa();
  renderKategori();
  renderRekap();
  renderSaldo();

}

function renderSiswa(){

  const select =
    document.getElementById(
      "siswaSelect"
    );

  select.innerHTML = "";

  DASHBOARD.siswa.forEach(s=>{

    select.innerHTML += `

      <option
      value="${s.no}|${s.nama}"
      >

        ${s.nama}

      </option>

    `;

  });

}

function renderKategori(){

  const box =
    document.getElementById(
      "kategoriBox"
    );

  box.innerHTML = "";

  TARGET.forEach(t=>{

    box.innerHTML += `

      <div class="kategoriRow">

        <div class="kategoriLabel">
          ${t.kategori}
        </div>

        <input
        type="number"
        id="kat_${t.kategori}"
        value="0"
        class="kategoriInput"
        >

      </div>

    `;

  });

}

async function saveTransaksi(){

  const siswa =
    document
    .getElementById("siswaSelect")
    .value
    .split("|");

  let adaInput = false;

  for(let i=0;i<TARGET.length;i++){

    const t = TARGET[i];

    const nominal =
      Number(
        document
        .getElementById(
          "kat_" + t.kategori
        )
        .value || 0
      );

    if(nominal > 0){

      adaInput = true;

      await postData({

        action:"saveTransaksi",

        no:siswa[0],

        nama:siswa[1],

        kategori:t.kategori,

        jumlah:nominal,

        oleh:LOGIN_NAME

      });

    }

  }

  if(!adaInput){

    popup("Isi minimal 1 nominal");
    return;

  }

  await loadDashboard();

  renderKategori();

  popup("Transaksi berhasil");

}

async function saveSetor(){

  const res = await postData({

    action:"saveSetor",

    KAS:
      document
      .getElementById("setorKAS")
      .value || 0,

    GALON:
      document
      .getElementById("setorGALON")
      .value || 0,

    KARTU:
      document
      .getElementById("setorKARTU")
      .value || 0,

    TALI:
      document
      .getElementById("setorTALI")
      .value || 0,

    penerima:
      document
      .getElementById("penerima")
      .value

  });

  if(res.success){

    document.getElementById("setorKAS").value = "";
    document.getElementById("setorGALON").value = "";
    document.getElementById("setorKARTU").value = "";
    document.getElementById("setorTALI").value = "";
    document.getElementById("penerima").value = "";

    await loadDashboard();

    popup("Setoran berhasil");

  }

}

function renderRekap(){

  const table =
    document.getElementById(
      "rekapTable"
    );

  let html = "";

  DASHBOARD.rekap.forEach((row,index)=>{

    html += "<tr>";

    row.forEach((cell,col)=>{

      if(index === 0){

        html += `
          <th>${cell}</th>
        `;

      }

      else{

        if(col === 0){

          html += `
            <td style="text-align:left;font-weight:600">
              ${cell}
            </td>
          `;

        }

        else if(
          String(cell).toUpperCase()
          === "LUNAS"
        ){

          html += `
            <td>
              <span class="lunas">
                LUNAS
              </span>
            </td>
          `;

        }

        else{

          const nominal =
            Number(cell || 0);

          html += `
            <td>
              <span class="kurang">
                Rp${nominal.toLocaleString('id-ID')}
              </span>
            </td>
          `;

        }

      }

    });

    html += "</tr>";

  });

  table.innerHTML = html;

}

function renderSaldo(){

  const saldo =
    DASHBOARD.saldo;

  let pemasukanHTML = "";
  let setorHTML = "";
  let saldoHTML = "";

  let totalMasuk = 0;
  let totalKeluar = 0;
  let totalSaldo = 0;

  saldo.slice(1).forEach(s=>{

    const kategori = s[0];

    const masuk =
      Number(s[1] || 0);

    const keluar =
      Number(s[2] || 0);

    const akhir =
      Number(s[3] || 0);

    totalMasuk += masuk;
    totalKeluar += keluar;
    totalSaldo += akhir;

    pemasukanHTML += `

      <div class="saldoItem">

        <div>
          ${kategori}
        </div>

        <div>
          Rp${masuk.toLocaleString('id-ID')}
        </div>

      </div>

    `;

    setorHTML += `

      <div class="saldoItem">

        <div>
          ${kategori}
        </div>

        <div>
          Rp${keluar.toLocaleString('id-ID')}
        </div>

      </div>

    `;

    saldoHTML += `

      <div class="saldoItem">

        <div>
          ${kategori}
        </div>

        <div>
          Rp${akhir.toLocaleString('id-ID')}
        </div>

      </div>

    `;

  });

  document
    .getElementById("saldoContent")
    .innerHTML = `

      <div class="saldoSection">

        <h3 class="saldoTitle">
          Total Pemasukan
        </h3>

        ${pemasukanHTML}

        <div class="totalSaldo">

          <div>
            TOTAL MASUK
          </div>

          <div>
            Rp${totalMasuk.toLocaleString('id-ID')}
          </div>

        </div>

      </div>

      <div class="saldoSection">

        <h3 class="saldoTitle">
          Sudah Disetor
        </h3>

        ${setorHTML}

        <div class="totalSaldo">

          <div>
            TOTAL SETOR
          </div>

          <div>
            Rp${totalKeluar.toLocaleString('id-ID')}
          </div>

        </div>

      </div>

      <div class="saldoSection">

        <h3 class="saldoTitle">
          Saldo Bendahara
        </h3>

        ${saldoHTML}

        <div class="totalSaldo">

          <div>
            TOTAL SALDO
          </div>

          <div>
            Rp${totalSaldo.toLocaleString('id-ID')}
          </div>

        </div>

      </div>

    `;

}

function showMenu(menu){

  document
    .getElementById("menuInput")
    .classList.add("hidden");

  document
    .getElementById("menuRekap")
    .classList.add("hidden");

  document
    .getElementById("menuSaldo")
    .classList.add("hidden");

  document
    .getElementById("btnInput")
    .classList.remove("active");

  document
    .getElementById("btnRekap")
    .classList.remove("active");

  document
    .getElementById("btnSaldo")
    .classList.remove("active");

  if(menu == "input"){

    document
      .getElementById("menuInput")
      .classList.remove("hidden");

    document
      .getElementById("btnInput")
      .classList.add("active");

  }

  if(menu == "rekap"){

    document
      .getElementById("menuRekap")
      .classList.remove("hidden");

    document
      .getElementById("btnRekap")
      .classList.add("active");

  }

  if(menu == "saldo"){

    document
      .getElementById("menuSaldo")
      .classList.remove("hidden");

    document
      .getElementById("btnSaldo")
      .classList.add("active");

  }

}

async function loadSiswaDashboard(nisn){

  const res = await postData({

    action:"getSiswaDashboard",

    nisn:nisn

  });

  if(!res.success){

    popup("Data tidak ditemukan");
    return;

  }

  document
    .getElementById("loginPage")
    .classList.add("hidden");

  document
    .getElementById("siswaPage")
    .classList.remove("hidden");

  document
    .getElementById("fotoSiswa")
    .src = res.siswa.foto;

  document
    .getElementById("namaSiswa")
    .innerHTML = res.siswa.nama;

  document
    .getElementById("jkSiswa")
    .innerHTML = res.siswa.jk;

  document
    .getElementById("nisnSiswa")
    .innerHTML = res.siswa.nisn;

  let bayar = "";
  let kurang = "";

  Object.keys(res.bayar)
  .forEach(k=>{

    bayar += `

      <div class="saldoItem">

        <div>${k}</div>

        <div>

          Rp${Number(
            res.bayar[k]
          ).toLocaleString('id-ID')}

        </div>

      </div>

    `;

  });

  Object.keys(res.kurang)
  .forEach(k=>{

    kurang += `

      <div class="saldoItem">

        <div>${k}</div>

        <div>

          Rp${Number(
            res.kurang[k]
          ).toLocaleString('id-ID')}

        </div>

      </div>

    `;

  });

  document
    .getElementById("sudahBayar")
    .innerHTML = bayar;

  document
    .getElementById("belumBayar")
    .innerHTML = kurang;

}

async function logout(){

  try{

    await postData({

      action:"logout",

      user:LOGIN_USER,

      nama:LOGIN_NAME,

      role:LOGIN_ROLE,

      sessionId:
        localStorage.getItem(
          "eb_session"
        )

    });

  }catch(err){}

  clearSession();

  location.reload();

}

</script>

</html>
