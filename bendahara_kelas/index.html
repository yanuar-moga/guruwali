<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Bendahara Kelas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f0f2f5;
      color: #333;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 600px; /* Nyaman di PC, pas di HP */
      padding: 20px;
    }
    .card {
      border: none;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      overflow: hidden;
      margin-bottom: 20px;
    }
    .header-app {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px 20px;
      text-align: center;
      border-radius: 0 0 30px 30px;
      margin-bottom: -20px;
    }
    .btn-primary {
      background: #667eea;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-weight: 600;
      transition: all 0.3s;
    }
    .btn-primary:hover {
      background: #5a67d8;
      transform: translateY(-2px);
    }
    .nav-pills .nav-link {
      color: #764ba2;
      border-radius: 10px;
      font-weight: 500;
    }
    .nav-pills .nav-link.active {
      background-color: #764ba2;
    }
    .form-control, .form-select {
      border-radius: 10px;
      padding: 12px;
      border: 1px solid #e2e8f0;
    }
    .hidden { display: none; }
    .status-badge {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 20px;
    }
    .table-responsive {
      border-radius: 15px;
    }
    #loginSection {
      margin-top: 50px;
    }
    .pin-input {
      letter-spacing: 10px;
      text-align: center;
      font-size: 1.5rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="header-app shadow">
    <h3 class="mb-0">💰 E-Bendahara</h3>
    <p class="small opacity-75">Sistem Keuangan Kelas Digital</p>
  </div>

  <div class="container">
    <!-- SECTION LOGIN -->
    <div id="loginSection" class="card p-4 animate__animated animate__fadeIn">
      <div class="text-center mb-4">
        <h5 class="fw-bold">Selamat Datang</h5>
        <p class="text-muted small">Silakan masukkan PIN akses Anda</p>
      </div>
      <div class="mb-3">
        <input type="password" id="pinInput" class="form-control pin-input" placeholder="••••••" inputmode="numeric" maxlength="6">
      </div>
      <button onclick="login()" id="btnLogin" class="btn btn-primary w-100">MASUK KE PANEL</button>
    </div>

    <!-- MAIN PANEL -->
    <div id="mainSection" class="hidden">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="user-info">
          <small class="text-muted d-block" id="roleLabel"></small>
          <strong id="userNameLabel"></strong>
        </div>
        <button onclick="logoutManual()" class="btn btn-outline-danger btn-sm rounded-pill">Logout</button>
      </div>

      <ul class="nav nav-pills nav-fill mb-3 card p-2 flex-row" id="pills-tab" role="tablist">
        <li class="nav-item">
          <button class="nav-link active" onclick="showTab('input')">Input Data</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" onclick="loadRekap()">Rekapitulasi</button>
        </li>
      </ul>

      <!-- TAB INPUT -->
      <div id="tabInput" class="card p-4">
        <div class="mb-3">
          <label class="form-label small fw-bold">Pilih Siswa</label>
          <select id="siswaSelect" class="form-select shadow-sm"></select>
        </div>
        <div class="mb-3">
          <label class="form-label small fw-bold">Kategori Iuran</label>
          <select id="katSelect" class="form-select shadow-sm"></select>
        </div>
        <div class="mb-3">
          <label class="form-label small fw-bold">Nominal Pembayaran</label>
          <div class="input-group">
            <span class="input-group-text">Rp</span>
            <input type="number" id="jumlahInput" class="form-control shadow-sm" placeholder="0">
          </div>
        </div>
        <button onclick="simpan()" id="btnSimpan" class="btn btn-primary w-100 mt-2">SIMPAN TRANSAKSI</button>
      </div>

      <!-- TAB REKAP -->
      <div id="tabRekap" class="hidden animate__animated animate__fadeIn">
        <div class="card p-0 overflow-hidden">
          <div class="p-3 bg-light border-bottom">
            <h6 class="mb-0 fw-bold">Status Pelunasan Siswa</h6>
            <small class="text-muted">Menampilkan sisa tagihan per kategori</small>
          </div>
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0" id="tableRekap" style="font-size: 0.85rem;">
              <!-- Data dimuat via Script -->
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let role = "";
    let namaUser = "";
    let sessionID = "";

    function login() {
      const pin = document.getElementById('pinInput').value;
      const btn = document.getElementById('btnLogin');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Mencocokkan...';

      google.script.run.withSuccessHandler(res => {
        if(res) {
          role = res.role;
          namaUser = res.nama;
          sessionID = res.sessionID;
          document.getElementById('loginSection').classList.add('hidden');
          document.getElementById('mainSection').classList.remove('hidden');
          document.getElementById('roleLabel').innerText = role;
          document.getElementById('userNameLabel').innerText = namaUser;
          initApp();
        } else { 
          alert("PIN Salah atau Tidak Terdaftar!"); 
          btn.disabled = false;
          btn.innerText = 'MASUK KE PANEL';
        }
      }).checkLogin(pin);
    }

    function initApp() {
      google.script.run.withSuccessHandler(res => {
        let sOpt = res.siswa.map(s => `<option value="${s[0]}">${s[0]}. ${s[1]}</option>`).join('');
        let kOpt = res.target.map(k => `<option value="${k[0]}">${k[0]}</option>`).join('');
        document.getElementById('siswaSelect').innerHTML = sOpt;
        document.getElementById('katSelect').innerHTML = kOpt;
      }).getInitialData();
    }

    function simpan() {
      const data = {
        absen: document.getElementById('siswaSelect').value,
        namaSiswa: document.getElementById('siswaSelect').options[document.getElementById('siswaSelect').selectedIndex].text.split('. ')[1],
        kategori: document.getElementById('katSelect').value,
        jumlah: document.getElementById('jumlahInput').value,
        role: role,
        namaUser: namaUser
      };
      
      if(!data.jumlah) return alert("Masukkan nominal uang!");
      
      const btn = document.getElementById('btnSimpan');
      btn.disabled = true;
      btn.innerText = "Mengirim...";

      google.script.run.withSuccessHandler(msg => {
        alert(msg);
        document.getElementById('jumlahInput').value = "";
        btn.disabled = false;
        btn.innerText = "SIMPAN TRANSAKSI";
      }).saveTransaction(data);
    }

    function loadRekap() {
      showTab('rekap');
      const table = document.getElementById('tableRekap');
      table.innerHTML = '<div class="p-4 text-center"><div class="spinner-border text-primary"></div><p>Menghitung data...</p></div>';
      
      google.script.run.withSuccessHandler(res => {
        let html = `<thead class="table-light"><tr><th class="ps-3">Siswa</th>`;
        res.kategori.forEach(k => html += `<th class="text-center">${k}</th>`);
        html += `</tr></thead><tbody>`;
        
        res.rekap.forEach(r => {
          html += `<tr><td class="ps-3 fw-bold">${r.nama}<br><small class="text-muted">Absen ${r.absen}</small></td>`;
          res.kategori.forEach(k => {
            let status = r.iuran[k];
            let isLunas = status === "LUNAS";
            html += `<td class="text-center">
              <span class="status-badge ${isLunas ? 'bg-success-subtle text-success' : 'bg-danger-subtle text-danger'}">
                ${status}
              </span>
            </td>`;
          });
          html += `</tr>`;
        });
        table.innerHTML = html + "</tbody>";
      }).getRekap();
    }

    function showTab(t) {
      document.getElementById('tabInput').classList.toggle('hidden', t !== 'input');
      document.getElementById('tabRekap').classList.toggle('hidden', t !== 'rekap');
      
      const tabs = document.querySelectorAll('.nav-link');
      tabs[0].classList.toggle('active', t === 'input');
      tabs[1].classList.toggle('active', t === 'rekap');
    }

    function logoutManual() {
      if (sessionID) {
        google.script.run.withSuccessHandler(() => location.reload()).recordLogout(sessionID);
      } else {
        location.reload();
      }
    }

    window.addEventListener('beforeunload', () => {
      if (sessionID) google.script.run.recordLogout(sessionID);
    });
  </script>
</body>
</html>
