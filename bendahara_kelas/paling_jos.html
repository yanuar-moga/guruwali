<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>E-Bendahara</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#eef2ff;
max-width:500px;
margin:auto;
min-height:100vh;
}

.header{
background:linear-gradient(135deg,#4f46e5,#7c3aed);
padding:35px 20px;
text-align:center;
color:white;
border-bottom-left-radius:30px;
border-bottom-right-radius:30px;
box-shadow:0 6px 20px rgba(79,70,229,.3);
}

.logo{
font-size:46px;
margin-bottom:8px;
}

.title{
font-size:24px;
font-weight:700;
}

.subtitle{
font-size:13px;
opacity:.9;
margin-top:4px;
}

.container{
padding:18px;
}

.card{
background:white;
border-radius:24px;
padding:18px;
margin-bottom:18px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
animation:fade .3s ease;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(10px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.pin-badge{
display:inline-block;
padding:5px 12px;
background:#dbeafe;
color:#2563eb;
border-radius:999px;
font-size:12px;
font-weight:700;
margin-bottom:5px;
}

.user-name{
font-size:22px;
font-weight:700;
}

.top-flex{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:18px;
}

.logout{
border:none;
background:#fee2e2;
color:#dc2626;
padding:10px 18px;
border-radius:999px;
cursor:pointer;
font-weight:700;
}

.menu{
display:flex;
gap:10px;
overflow:auto;
}

.menu button{
flex:1;
padding:14px;
border:none;
border-radius:16px;
background:#f3f4f6;
cursor:pointer;
font-weight:600;
font-size:13px;
white-space:nowrap;
}

.menu .active{
background:#7c3aed;
color:white;
box-shadow:0 6px 15px rgba(124,58,237,.35);
}

.input-group{
margin-bottom:18px;
}

.label{
font-size:13px;
font-weight:700;
margin-bottom:8px;
display:block;
color:#4b5563;
}

select,input{
width:100%;
padding:14px;
border-radius:14px;
border:1px solid #d1d5db;
font-size:14px;
outline:none;
}

.table-head{
display:grid;
grid-template-columns:1fr 140px;
font-size:13px;
font-weight:700;
margin-bottom:10px;
padding-top:15px;
border-top:1px solid #e5e7eb;
color:#6b7280;
}

.row{
display:grid;
grid-template-columns:1fr 140px;
gap:12px;
margin-bottom:12px;
align-items:center;
}

.save-btn{
width:100%;
padding:16px;
border:none;
border-radius:16px;
background:linear-gradient(135deg,#4f46e5,#7c3aed);
color:white;
font-size:15px;
font-weight:700;
cursor:pointer;
margin-top:12px;
box-shadow:0 8px 18px rgba(79,70,229,.25);
}

.rekap-table{
width:100%;
border-collapse:collapse;
font-size:12px;
}

.rekap-table th{
padding:12px 8px;
text-align:left;
border-bottom:1px solid #e5e7eb;
background:#f8fafc;
font-size:11px;
}

.rekap-table td{
padding:12px 8px;
border-bottom:1px solid #f1f5f9;
}

.badge-lunas{
background:#dcfce7;
color:#15803d;
padding:7px 12px;
border-radius:999px;
font-size:11px;
font-weight:700;
display:inline-block;
}

.badge-kurang{
background:#fee2e2;
color:#dc2626;
padding:7px 12px;
border-radius:999px;
font-size:11px;
font-weight:700;
display:inline-block;
}

.saldo-row{
display:flex;
justify-content:space-between;
margin-bottom:18px;
font-weight:600;
padding-bottom:10px;
border-bottom:1px dashed #ddd;
}

.total-box{
background:linear-gradient(135deg,#2563eb,#4f46e5);
color:white;
padding:18px;
border-radius:18px;
display:flex;
justify-content:space-between;
font-size:22px;
font-weight:700;
margin-top:15px;
}

.footer{
text-align:center;
font-size:12px;
color:#6b7280;
padding:25px;
line-height:1.7;
}

.hidden{
display:none;
}

.login-card{
margin-top:30px;
}

.login-title{
text-align:center;
font-size:30px;
font-weight:700;
margin-bottom:8px;
}

.login-sub{
text-align:center;
color:#6b7280;
margin-bottom:30px;
font-size:14px;
}

.pin-input{
font-size:30px;
text-align:center;
letter-spacing:12px;
font-weight:700;
}

.sync-badge{
background:#ecfeff;
color:#0891b2;
padding:7px 14px;
border-radius:999px;
font-size:11px;
font-weight:700;
}

.info-update{
font-size:11px;
color:#9ca3af;
margin-top:10px;
}

.popup{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
background:#111827;
color:white;
padding:14px 20px;
border-radius:14px;
font-size:13px;
font-weight:600;
z-index:999;
display:none;
animation:fade .3s ease;
}

</style>

</head>
<body>

<div class="popup" id="popup"></div>

<div class="header">

<div class="logo">💰</div>

<div class="title">
E-Bendahara
</div>

<div class="subtitle">
Manajemen Keuangan Kelas Digital
</div>

</div>

<div class="container">

<!-- LOGIN -->

<div id="loginPage">

<div class="card login-card">

<div class="login-title">
Selamat Datang
</div>

<div class="login-sub">
Masukkan PIN Keamanan
</div>

<input
type="password"
id="pin"
class="pin-input"
maxlength="6"
placeholder="••••••"
/>

<button class="save-btn" onclick="login()">
BUKA PANEL KAS
</button>

</div>

</div>

<!-- DASHBOARD -->

<div id="dashboard" class="hidden">

<div class="top-flex">

<div>

<div class="pin-badge" id="roleText">
PIN_ADMIN
</div>

<div class="user-name" id="userName">
User
</div>

</div>

<button class="logout" onclick="logout()">
Logout
</button>

</div>

<div class="card">

<div class="menu">

<button
class="active"
onclick="showMenu('inputPage',this)">
Input
</button>

<button
onclick="showMenu('rekapPage',this)">
Rekap
</button>

<button
onclick="showMenu('saldoPage',this)">
Saldo
</button>

</div>

</div>

<!-- INPUT -->

<div id="inputPage">

<div class="card">

<div class="input-group">

<label class="label">
Nama Siswa
</label>

<select id="namaSiswa"></select>

</div>

<div class="table-head">

<div>KATEGORI</div>
<div>NOMINAL</div>

</div>

<div id="kategoriContainer"></div>

<button
class="save-btn"
onclick="saveTransaksi()">
SIMPAN TRANSAKSI
</button>

</div>

</div>

<!-- REKAP -->

<div id="rekapPage" class="hidden">

<div class="card">

<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;">

<div>

<div style="font-size:22px;font-weight:700;">
Monitoring Pelunasan
</div>

<div class="info-update" id="updateText">
Auto Sync
</div>

</div>

<div class="sync-badge">
AUTO SYNC
</div>

</div>

<div style="overflow:auto;">

<table class="rekap-table">

<thead id="rekapHead"></thead>

<tbody id="rekapBody"></tbody>

</table>

</div>

</div>

</div>

<!-- SALDO -->

<div id="saldoPage" class="hidden">

<div class="card">

<div id="saldoList"></div>

<div class="total-box">

<div>TOTAL</div>

<div id="grandTotal">
Rp0
</div>

</div>

</div>

</div>

</div>

</div>

<div class="footer">

Aplikasi e bendahara v 1.2 (Build 15 Mei 2026)<br>
Apps by MB © 2026 MB All Rights Reserved

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbwm-CfRMCmbYBeEN26WMqtDpRkDHWyvEPGGEs95ZsdfIyxdpWSOqNrVkSvxyOiJmXF6IA/exec";

let LOGIN_NAME = "";
let SESSION_ID = "";
let MASTER = {};

document
.getElementById("pin")
.addEventListener("keypress",function(e){

if(e.key === "Enter"){
login();
}

});

/************************************************
 POPUP
************************************************/

function showPopup(text){

const popup =
document.getElementById("popup");

popup.innerText = text;

popup.style.display = "block";

setTimeout(()=>{

popup.style.display = "none";

},2500);

}

/************************************************
 API
************************************************/

async function api(action,data={}){

const res = await fetch(API_URL,{

method:"POST",

body:JSON.stringify({

action,
...data

})

});

return await res.json();

}

/************************************************
 LOGIN
************************************************/

async function login(){

const pin =
document.getElementById("pin").value;

const res = await api("login",{

pin:pin,
device:navigator.userAgent,
ip:"UNKNOWN"

});

if(!res.status){

showPopup(res.message);

return;

}

/*
SIMPAN SESSION
*/

localStorage.setItem(

"ebendahara_session",

JSON.stringify(res)

);

openDashboard(res);

}

/************************************************
 OPEN DASHBOARD
************************************************/

function openDashboard(res){

LOGIN_NAME = res.nama;

SESSION_ID = res.sessionID;

document
.getElementById("loginPage")
.classList.add("hidden");

document
.getElementById("dashboard")
.classList.remove("hidden");

document
.getElementById("userName")
.innerText = res.nama;

document
.getElementById("roleText")
.innerText = res.user;

loadMaster();

loadRekap();

loadSaldo();

}

/************************************************
 AUTO LOGIN
************************************************/

window.onload = function(){

const session =
localStorage.getItem(
"ebendahara_session"
);

if(session){

const data = JSON.parse(session);

openDashboard(data);

}

}

/************************************************
 MASTER
************************************************/

async function loadMaster(){

const res = await api("master");

MASTER = res;

document
.getElementById("updateText")
.innerText =
"Update : " + res.update;

const siswa =
document.getElementById("namaSiswa");

siswa.innerHTML = "";

res.siswa.forEach(item=>{

siswa.innerHTML += `
<option>${item}</option>
`;

});

const kategori =
document.getElementById(
"kategoriContainer"
);

kategori.innerHTML = "";

res.kategori.forEach(item=>{

kategori.innerHTML += `

<div class="row">

<div>
${item.kategori}
</div>

<div>

<input
type="number"
class="nominal"
data-kategori="${item.kategori}"
value="0"
/>

</div>

</div>

`;

});

}

/************************************************
 SAVE TRANSAKSI
************************************************/

async function saveTransaksi(){

const items = [];

document
.querySelectorAll(".nominal")
.forEach(el=>{

items.push({

kategori:el.dataset.kategori,
nominal:el.value

});

});

const nama =
document.getElementById(
"namaSiswa"
).value;

const res = await api(

"saveTransaksi",

{

nama:nama,
oleh:LOGIN_NAME,
items:items

}

);

showPopup(res.message);

document
.querySelectorAll(".nominal")
.forEach(el=>{

el.value = 0;

});

loadSaldo();
loadRekap();

}

/************************************************
 LOAD REKAP
************************************************/

async function loadRekap(){

const res = await api("rekap");

const kategoriShow =
MASTER.kategori.map(
x=>x.kategori
);

let head = `
<tr>
<th>Nama Siswa</th>
`;

kategoriShow.forEach(k=>{

head += `<th>${k}</th>`;

});

head += `</tr>`;

document
.getElementById("rekapHead")
.innerHTML = head;

const body =
document.getElementById(
"rekapBody"
);

body.innerHTML = "";

res.forEach(item=>{

let row = `
<tr>

<td>
<b>${item.nama}</b>
</td>
`;

item.kategori.forEach(k=>{

if(k.status == "LUNAS"){

row += `
<td>
<span class="badge-lunas">
LUNAS
</span>
</td>
`;

}else{

row += `
<td>
<span class="badge-kurang">
${k.status}
</span>
</td>
`;

}

});

row += `</tr>`;

body.innerHTML += row;

});

}

/************************************************
 LOAD SALDO
************************************************/

async function loadSaldo(){

const res = await api("saldo");

const saldo =
document.getElementById(
"saldoList"
);

saldo.innerHTML = "";

let total = 0;

Object.keys(res).forEach(key=>{

total += Number(res[key]);

saldo.innerHTML += `

<div class="saldo-row">

<div>${key}</div>

<div>
Rp${Number(
res[key]
).toLocaleString("id-ID")}
</div>

</div>

`;

});

document
.getElementById("grandTotal")
.innerText =

"Rp" +
total.toLocaleString("id-ID");

}

/************************************************
 LOGOUT
************************************************/

async function logout(){

await api("logout",{

sessionID:SESSION_ID

});

localStorage.removeItem(
"ebendahara_session"
);

location.reload();

}

/************************************************
 MENU
************************************************/

function showMenu(id,el){

document
.getElementById("inputPage")
.classList.add("hidden");

document
.getElementById("rekapPage")
.classList.add("hidden");

document
.getElementById("saldoPage")
.classList.add("hidden");

document
.getElementById(id)
.classList.remove("hidden");

document
.querySelectorAll(".menu button")
.forEach(btn=>{

btn.classList.remove("active");

});

el.classList.add("active");

}

</script>

</body>
</html>
