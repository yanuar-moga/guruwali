<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Bendahara Kelas</title>
  <!-- Framework & Fonts -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <!-- SweetAlert2 untuk Pop-up Custom -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f8fafc;
      color: #334155;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .header-app {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      color: white;
      padding: 35px 20px;
      text-align: center;
      border-radius: 0 0 30px 30px;
      box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
    }
    .container {
      max-width: 700px;
      padding: 20px;
      flex: 1; /* Membuat container mengambil sisa ruang agar footer tetap di bawah */
    }
    .card {
      border: none;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.03);
      margin-bottom: 20px;
    }
    .btn-primary {
      background: #4f46e5;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-weight: 600;
      transition: all 0.3s;
    }
    .btn-primary:hover { background: #4338ca; transform: translateY(-1px); }
    .nav-pills .nav-link.active { background-color: #7c3aed; box-shadow: 0 4px 10px rgba(124, 58, 237, 0.3); }
    .nav-pills .nav-link { color: #64748b; font-weight: 500; font-size: 0.9rem; border-radius: 10px; }
    .hidden { display: none; }
    .pin-input {
      letter-spacing: 8px;
      text-align: center;
      font-size: 1.5rem;
      font-weight: bold;
      border-radius: 12px;
    }
    .status-badge {
      font-size: 0.7rem;
      padding: 5px 10px;
      border-radius: 12px;
      font-weight: 600;
      display: inline-block;
      white-space: nowrap;
    }
    .bg-lunas { background-color: #dcfce7; color: #15803d; }
    .bg-sisa { background-color: #fee2e2; color: #b91c1c; }
    .fade-in { animation: fadeIn 0.4s ease-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .table-responsive { border-radius: 15px; }
    th { text-transform: uppercase; letter-spacing: 0.5px; font-size: 0.75rem; }
    
    /* Style untuk Footer */
    .footer {
      text-align: center;
      padding: 20px;
      font-size: 0.75rem;
      color: #94a3b8;
      background: transparent;
    }
  </style>
</head>
<body>

  <div class="header-app">
    <h3 class="mb-0">💰 E-Bendahara</h3>
    <p class="small opacity-75 mb-0">Manajemen Keuangan Kelas Digital</p>
  </div>

  <div class="container">
    <!-- SECTION LOGIN -->
    <div id="loginSection" class="card p-4 fade-in">
      <div class="text-center mb-4">
        <h5 class="fw-bold">Selamat Datang</h5>
        <p class="text-muted small">Masukkan PIN Keamanan untuk akses</p>
      </div>
      <div class="mb-3">
        <input type="password" id="pinInput" class="form-control pin-input" placeholder="••••••" inputmode="numeric" maxlength="6">
      </div>
      <button onclick="login()" id="btnLogin" class="btn btn-primary w-100 shadow-sm">BUKA PANEL KAS</button>
    </div>

    <!-- MAIN PANEL -->
    <div id="mainSection" class="hidden fade-in">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <span class="badge bg-primary-subtle text-primary mb-1" id="roleLabel"></span>
          <h5 class="fw-bold mb-0" id="userNameLabel"></h5>
        </div>
        <button onclick="logoutManual()" class="btn btn-outline-danger btn-sm rounded-pill px-3">Keluar</button>
      </div>

      <ul class="nav nav-pills nav-fill mb-4 card p-2 flex-row shadow-sm bg-white">
        <li class="nav-item">
          <button class="nav-link active" id="tabInBtn" onclick="showTab('input')">Input Data</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" id="tabRekapBtn" onclick="loadRekap()">Rekap Iuran</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" id="tabTotalBtn" onclick="loadTotalDana()">Total Saldo</button>
        </li>
      </ul>

      <!-- TAB INPUT -->
      <div id="tabInput" class="card p-3 shadow-sm fade-in">
        <div class="mb-3 border-bottom pb-3">
          <label class="form-label small fw-bold text-secondary">Pilih Nama Siswa</label>
          <select id="siswaSelect" class="form-select border-0 bg-light shadow-none" style="border-radius: 10px;"></select>
        </div>
        
        <div class="table-responsive">
          <table class="table table-borderless align-middle">
            <thead class="bg-light">
              <tr class="text-muted">
                <th class="ps-3">Kategori</th>
                <th style="width: 150px;">Nominal (Rp)</th>
              </tr>
            </thead>
            <tbody id="inputTableBody">
              <!-- Dinamis oleh Script -->
            </tbody>
          </table>
        </div>
        
        <button onclick="simpanMulti()" id="btnSimpan" class="btn btn-primary w-100 mt-3 shadow-sm">SIMPAN TRANSAKSI</button>
      </div>

      <!-- TAB REKAP -->
      <div id="tabRekap" class="hidden fade-in">
        <div class="card p-0 overflow-hidden shadow-sm">
          <div class="p-3 bg-white border-bottom d-flex justify-content-between align-items-center">
            <h6 class="mb-0 fw-bold">Monitoring Pelunasan</h6>
            <span class="badge bg-secondary-subtle text-secondary" style="font-size: 0.65rem;">Auto-Sync</span>
          </div>
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0" id="tableRekap" style="font-size: 0.82rem;">
              <!-- Data Rekap Muncul Di Sini -->
            </table>
          </div>
        </div>
      </div>

      <!-- TAB TOTAL DANA -->
      <div id="tabTotal" class="hidden fade-in">
        <div id="totalDanaContainer"></div>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    <div>Aplikasi e bendahara v 1.0 (Build 14 Mei 2026)</div>
    <div>Apps by MB © 2026 MB All Rights Reserved</div>
  </div>

  <script>
    // URL Deployment GAS Anda
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyt3p4O8Wbjwlg1ILlq7PMvYUA2na3TWcaMB54PEH11zHw9rBRoKOI4nnTRFz8pdURNZQ/exec";
    const categories = ["KAS", "GALON", "KARTU PELAJAR", "TALI ASIH", "LAIN 1", "LAIN 2"];

    let role = "";
    let namaUser = "";
    let sessionID = "";

    window.onload = function() {
      checkSession();
    };

    function checkSession() {
      const savedSession = localStorage.getItem("ebendahara_session");
      if (savedSession) {
        const data = JSON.parse(savedSession);
        role = data.role;
        namaUser = data.nama;
        sessionID = data.sessionID;

        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('mainSection').classList.remove('hidden');
        document.getElementById('roleLabel').innerText = role;
        document.getElementById('userNameLabel').innerText = namaUser;
        
        initApp();
      }
    }

    async function callGAS(action, payload = {}) {
      try {
        const response = await fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify({ action: action, ...payload })
        });
        const res = await response.json();
        if (res.status === "success") return res.data;
        throw new Error(res.message);
      } catch (err) {
        console.error(err);
        return null;
      }
    }

    async function login() {
      const pin = document.getElementById('pinInput').value;
      const btn = document.getElementById('btnLogin');
      if(!pin) return;

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Verifikasi...';

      const res = await callGAS("login", { pin: pin });
      if(res) {
        role = res.role;
        namaUser = res.nama;
        sessionID = res.sessionID;
        
        localStorage.setItem("ebendahara_session", JSON.stringify({
          role: role,
          nama: namaUser,
          sessionID: sessionID
        }));

        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('mainSection').classList.remove('hidden');
        document.getElementById('roleLabel').innerText = role;
        document.getElementById('userNameLabel').innerText = namaUser;
        
        Swal.fire({
          toast: true,
          position: 'top-end',
          icon: 'success',
          title: 'Halo, ' + namaUser,
          showConfirmButton: false,
          timer: 3000
        });

        initApp();
      } else {
        Swal.fire({
          icon: 'error',
          title: 'Akses Ditolak',
          text: 'PIN Salah!',
          confirmButtonColor: '#4f46e5'
        });
        btn.disabled = false;
        btn.innerText = 'BUKA PANEL KAS';
      }
    }

    async function initApp() {
      let html = "";
      categories.forEach(kat => {
        html += `<tr>
          <td class="ps-3"><div class="fw-bold small">${kat}</div></td>
          <td><input type="number" class="form-control form-control-sm iuran-input bg-light border-0" data-kat="${kat}" placeholder="0" style="border-radius: 8px;"></td>
        </tr>`;
      });
      document.getElementById('inputTableBody').innerHTML = html;

      const res = await callGAS("getInitialData");
      if(res) {
        let sOpt = res.siswa.map(s => `<option value="${s[0]}">${s[1]}</option>`).join('');
        document.getElementById('siswaSelect').innerHTML = sOpt;
      }
    }

    async function simpanMulti() {
      const inputs = document.querySelectorAll('.iuran-input');
      let items = [];
      inputs.forEach(inp => {
        if(inp.value > 0) items.push({ kategori: inp.dataset.kat, jumlah: inp.value });
      });

      if(items.length === 0) {
        Swal.fire({ icon: 'warning', title: 'Data Kosong', text: 'Isi nominal dulu!', confirmButtonColor: '#4f46e5' });
        return;
      }

      const btn = document.getElementById('btnSimpan');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Menyimpan...';

      const payload = {
        absen: document.getElementById('siswaSelect').value,
        namaSiswa: document.getElementById('siswaSelect').options[document.getElementById('siswaSelect').selectedIndex].text,
        role: role,
        namaUser: namaUser,
        items: items
      };

      try {
        const msg = await callGAS("saveMulti", { data: payload });
        if(msg) {
          Swal.fire({ icon: 'success', title: 'Berhasil!', text: 'Data iuran tersimpan.', confirmButtonColor: '#7c3aed' });
          inputs.forEach(inp => inp.value = "");
        }
      } catch (err) {
        Swal.fire({ icon: 'error', title: 'Gagal', text: 'Koneksi bermasalah.', confirmButtonColor: '#ef4444' });
      }
      
      btn.disabled = false;
      btn.innerText = "SIMPAN TRANSAKSI";
    }

    async function loadRekap() {
      showTab('rekap');
      const table = document.getElementById('tableRekap');
      table.innerHTML = '<tr><td class="p-5 text-center"><div class="spinner-border text-primary spinner-border-sm"></div><br><small class="text-muted">Sinkronisasi...</small></td></tr>';
      
      const res = await callGAS("rekap");
      if(!res) return table.innerHTML = '<tr><td class="p-4 text-center text-danger">Gagal memuat data.</td></tr>';

      let html = `<thead class="table-light text-nowrap"><tr><th class="ps-3">Nama Siswa</th>`;
      res.kategori.forEach(k => html += `<th class="text-center">${k}</th>`);
      html += `</tr></thead><tbody>`;
      
      res.rekap.forEach(r => {
        html += `<tr><td class="ps-3"><div class="fw-bold text-dark">${r.nama}</div><div class="text-muted" style="font-size: 0.65rem;">Absen ${r.absen}</div></td>`;
        res.kategori.forEach(k => {
          let status = r.iuran[k];
          let isLunas = status === "LUNAS";
          html += `<td class="text-center"><span class="status-badge ${isLunas ? 'bg-lunas' : 'bg-sisa'}">${status}</span></td>`;
        });
        html += `</tr>`;
      });
      table.innerHTML = html + "</tbody>";
    }

    async function loadTotalDana() {
      showTab('total');
      const container = document.getElementById('totalDanaContainer');
      container.innerHTML = '<div class="card p-4 text-center"><div class="spinner-border text-primary mx-auto mb-2"></div><br>Menghitung...</div>';
      
      const res = await callGAS("totalDana");
      if(!res) return container.innerHTML = '<div class="card p-4 text-center text-danger">Gagal.</div>';

      let html = `<div class="card p-3 shadow-sm border-0"><div class="list-group list-group-flush">`;
      let grandTotal = 0;
      for(let kat in res) {
        grandTotal += res[kat];
        html += `<div class="list-group-item d-flex justify-content-between align-items-center border-0 py-3">
          <div class="text-secondary fw-bold small">${kat}</div>
          <div class="fw-bold">Rp${res[kat].toLocaleString()}</div>
        </div>`;
      }
      html += `<div class="list-group-item d-flex justify-content-between align-items-center bg-primary text-white rounded-4 mt-2 py-3 px-3 shadow">
          <div class="fw-bold">TOTAL SALDO</div>
          <div class="fs-5 fw-bold">Rp${grandTotal.toLocaleString()}</div>
        </div></div></div>`;
      container.innerHTML = html;
    }

    function showTab(t) {
      document.getElementById('tabInput').classList.toggle('hidden', t !== 'input');
      document.getElementById('tabRekap').classList.toggle('hidden', t !== 'rekap');
      document.getElementById('tabTotal').classList.toggle('hidden', t !== 'total');
      document.getElementById('tabInBtn').classList.toggle('active', t === 'input');
      document.getElementById('tabRekapBtn').classList.toggle('active', t === 'rekap');
      document.getElementById('tabTotalBtn').classList.toggle('active', t === 'total');
    }

    function logoutManual() {
      Swal.fire({
        title: 'Keluar?',
        text: "Sesi akan dihapus.",
        icon: 'question',
        showCancelButton: true,
        confirmButtonColor: '#4f46e5',
        cancelButtonColor: '#64748b',
        confirmButtonText: 'Ya, Keluar'
      }).then((result) => {
        if (result.isConfirmed) {
          if (sessionID) callGAS("logout", { sessionID: sessionID });
          localStorage.removeItem("ebendahara_session");
          location.reload();
        }
      });
    }
  </script>
</body>
</html>
