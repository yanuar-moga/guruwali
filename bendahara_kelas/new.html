<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>E Bendahara</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Poppins',sans-serif;
  background:#0f172a;
  color:white;
  min-height:100vh;
}

.hidden{
  display:none;
}

.container{
  padding:18px;
}

.card{
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(12px);
  border-radius:24px;
  padding:18px;
  margin-bottom:18px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
}

h1{
  font-size:24px;
  margin-bottom:10px;
}

h2{
  margin-bottom:14px;
}

input,button,select{
  width:100%;
  border:none;
  outline:none;
  padding:14px;
  border-radius:16px;
  margin-top:10px;
  font-size:15px;
}

input,select{
  background:white;
  color:#111;
}

button{
  background:linear-gradient(
    135deg,
    #3b82f6,
    #06b6d4
  );
  color:white;
  font-weight:600;
}

.menu{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
}

.table-wrap{
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  border:1px solid rgba(255,255,255,.1);
  padding:10px;
  text-align:center;
  font-size:13px;
}

th{
  background:#1e293b;
}

.profile{
  text-align:center;
}

.profile img{
  width:120px;
  height:120px;
  object-fit:cover;
  border-radius:50%;
  border:4px solid white;
  margin-bottom:14px;
}

.popup{
  position:fixed;
  top:20px;
  right:20px;
  background:#10b981;
  padding:14px 20px;
  border-radius:16px;
  z-index:999;
  animation:slide .4s ease;
}

@keyframes slide{
  from{
    transform:translateX(100%);
    opacity:0;
  }
  to{
    transform:translateX(0);
    opacity:1;
  }
}

.footer{
  text-align:center;
  font-size:12px;
  opacity:.7;
  padding:20px;
}

</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="container">

  <div class="card">

    <h1>E Bendahara</h1>

    <p>Masukkan PIN</p>

    <input
      type="password"
      id="pin"
      placeholder="Masukkan PIN"
    >

    <button onclick="login()">
      LOGIN
    </button>

  </div>

</div>

<!-- ADMIN -->
<div id="adminPage"
class="hidden container">

  <div class="card">

    <h2 id="welcome"></h2>

    <div class="menu">

      <button onclick="showMenu('inputMenu')">
        Input
      </button>

      <button onclick="showMenu('rekapMenu')">
        Rekap
      </button>

      <button onclick="showMenu('saldoMenu')">
        Saldo
      </button>

    </div>

  </div>

  <!-- INPUT -->
  <div id="inputMenu">

    <div class="card">

      <h2>Input Iuran</h2>

      <select id="siswaSelect"></select>

      <div id="kategoriBox"></div>

      <button onclick="saveTransaksi()">
        Simpan Transaksi
      </button>

    </div>

  </div>

  <!-- REKAP -->
  <div id="rekapMenu"
  class="hidden">

    <div class="card">

      <h2>Monitoring Pelunasan</h2>

      <div id="updateInfo"></div>

      <div class="table-wrap">

        <table id="rekapTable"></table>

      </div>

    </div>

  </div>

  <!-- SALDO -->
  <div id="saldoMenu"
  class="hidden">

    <div class="card">

      <h2>Total Saldo</h2>

      <div id="saldoContent"></div>

    </div>

  </div>

  <button onclick="logout()">
    Logout
  </button>

</div>

<!-- SISWA -->
<div id="siswaPage"
class="hidden container">

  <div class="card profile">

    <img id="fotoSiswa">

    <h2 id="namaSiswa"></h2>

    <p id="jkSiswa"></p>

    <p id="nisnSiswa"></p>

  </div>

  <div class="card">

    <h2>Sudah Dibayar</h2>

    <div id="dibayar"></div>

  </div>

  <div class="card">

    <h2>Belum Dibayar</h2>

    <div id="belum"></div>

  </div>

  <div class="card">

    <div id="updateSiswa"></div>

  </div>

  <button onclick="logout()">
    Logout
  </button>

</div>

<div class="footer">

Aplikasi e bendahara v 1.2
(Build 15 Mei 2026)
<br>
Apps by MB © 2026
All Rights Reserved

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbyKNBJl0DghHMSjW-I7BcqjVncZQlO-_UwcLqAJUcL-_R_FuIYUReTaSaRmMNEpimnQ/exec";

let LOGIN_NAME = "";
let TARGET = [];

// ======================
// FETCH
// ======================
async function postData(data){

  const res = await fetch(API_URL,{
    method:"POST",
    body:JSON.stringify(data)
  });

  return await res.json();
}

// ======================
// POPUP
// ======================
function popup(text){

  const div = document.createElement("div");

  div.className = "popup";
  div.innerHTML = text;

  document.body.appendChild(div);

  setTimeout(()=>{
    div.remove();
  },3000);
}

// ======================
// ENTER LOGIN
// ======================
document
.getElementById("pin")
.addEventListener("keypress",function(e){

  if(e.key === "Enter"){
    login();
  }

});

// ======================
// LOGIN
// ======================
async function login(){

  const pin =
    document
    .getElementById("pin")
    .value;

  const res = await postData({
    action:"login",
    pin:pin
  });

  if(!res.success){

    popup(res.message);
    return;
  }

  LOGIN_NAME = res.nama;

  if(res.role === "ADMIN"){

    document
    .getElementById("loginPage")
    .classList.add("hidden");

    document
    .getElementById("adminPage")
    .classList.remove("hidden");

    document
    .getElementById("welcome")
    .innerHTML =
      "Halo, " + LOGIN_NAME;

    loadSiswa();
    loadTarget();

  }else{

    loadDashboardSiswa(pin);

  }

  popup("Login berhasil");
}

// ======================
// SHOW MENU
// ======================
function showMenu(id){

  document
    .getElementById("inputMenu")
    .classList.add("hidden");

  document
    .getElementById("rekapMenu")
    .classList.add("hidden");

  document
    .getElementById("saldoMenu")
    .classList.add("hidden");

  document
    .getElementById(id)
    .classList.remove("hidden");

  if(id === "rekapMenu"){
    loadRekap();
  }

  if(id === "saldoMenu"){
    loadSaldo();
  }
}

// ======================
// LOAD SISWA
// ======================
async function loadSiswa(){

  const res = await postData({
    action:"getSiswa"
  });

  const select =
    document.getElementById(
      "siswaSelect"
    );

  select.innerHTML = "";

  res.data.forEach(s=>{

    select.innerHTML += `
      <option value="${s.no}|${s.nama}">
        ${s.nama}
      </option>
    `;
  });
}

// ======================
// LOAD TARGET
// ======================
async function loadTarget(){

  const res = await postData({
    action:"getTarget"
  });

  TARGET = res.data;

  const box =
    document.getElementById(
      "kategoriBox"
    );

  box.innerHTML = "";

  TARGET.forEach(t=>{

    box.innerHTML += `
      <input
      type="number"
      id="kat_${t.kategori}"
      placeholder="${t.kategori}"
      >
    `;
  });

}

// ======================
// SAVE TRANSAKSI
// ======================
async function saveTransaksi(){

  const siswa =
    document
    .getElementById("siswaSelect")
    .value
    .split("|");

  const no = siswa[0];
  const nama = siswa[1];

  for(let i=0;i<TARGET.length;i++){

    const t = TARGET[i];

    const nominal =
      document.getElementById(
        "kat_" + t.kategori
      ).value;

    if(Number(nominal) > 0){

      await postData({
        action:"saveTransaksi",
        no:no,
        nama:nama,
        kategori:t.kategori,
        jumlah:nominal,
        oleh:LOGIN_NAME
      });
    }
  }

  popup("Transaksi berhasil");
}

// ======================
// REKAP
// ======================
async function loadRekap(){

  const res = await postData({
    action:"getRekap"
  });

  document
  .getElementById("updateInfo")
  .innerHTML =
    "Auto Sync • " +
    new Date(res.update)
    .toLocaleString();

  let html = "";

  res.data.forEach((r,i)=>{

    html += "<tr>";

    r.forEach(c=>{

      html += i == 0
        ? `<th>${c}</th>`
        : `<td>${c}</td>`;

    });

    html += "</tr>";
  });

  document
  .getElementById("rekapTable")
  .innerHTML = html;
}

// ======================
// SALDO
// ======================
async function loadSaldo(){

  const res = await postData({
    action:"getSaldo"
  });

  let html = "";

  html += "<h3>Saldo Bendahara</h3><br>";

  Object.keys(res.saldo)
  .forEach(k=>{

    html += `
      <p>
      ${k}
      :
      Rp ${res.saldo[k]}
      </p>
    `;
  });

  html += "<br><h3>Total Disetor</h3><br>";

  Object.keys(res.setor)
  .forEach(k=>{

    html += `
      <p>
      ${k}
      :
      Rp ${res.setor[k]}
      </p>
    `;
  });

  document
  .getElementById("saldoContent")
  .innerHTML = html;
}

// ======================
// DASHBOARD SISWA
// ======================
async function loadDashboardSiswa(nisn){

  const res = await postData({
    action:"getDashboardSiswa",
    nisn:nisn
  });

  if(!res.success){

    popup(res.message);
    return;
  }

  document
    .getElementById("loginPage")
    .classList.add("hidden");

  document
    .getElementById("siswaPage")
    .classList.remove("hidden");

  document
    .getElementById("fotoSiswa")
    .src = res.siswa.foto;

  document
    .getElementById("namaSiswa")
    .innerHTML = res.siswa.nama;

  document
    .getElementById("jkSiswa")
    .innerHTML = res.siswa.jk;

  document
    .getElementById("nisnSiswa")
    .innerHTML = res.siswa.nisn;

  let bayar = "";
  let kurang = "";

  Object.keys(res.bayar)
  .forEach(k=>{

    bayar += `
      <p>
      ${k}
      :
      Rp ${res.bayar[k]}
      </p>
    `;
  });

  Object.keys(res.kurang)
  .forEach(k=>{

    kurang += `
      <p>
      ${k}
      :
      Rp ${res.kurang[k]}
      </p>
    `;
  });

  bayar += `
    <hr style="margin:10px 0">
    <b>Total : Rp ${res.totalBayar}</b>
  `;

  kurang += `
    <hr style="margin:10px 0">
    <b>Total : Rp ${res.totalKurang}</b>
  `;

  document
    .getElementById("dibayar")
    .innerHTML = bayar;

  document
    .getElementById("belum")
    .innerHTML = kurang;

  document
    .getElementById("updateSiswa")
    .innerHTML =
      "Update : " +
      new Date(res.update)
      .toLocaleString();

}

// ======================
// LOGOUT
// ======================
function logout(){

  location.reload();

}

</script>

</body>
</html>
