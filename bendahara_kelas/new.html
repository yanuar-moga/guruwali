<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>E-Bendahara v1.2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f0f2f5; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .layer { display: none; padding: 15px; flex: 1; }
        .active { display: flex; flex-direction: column; animation: slideUp 0.4s ease-out; }
        
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Portrait Optimization */
        .card-main {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            background: #ffffff;
            margin-bottom: 20px;
        }

        .profile-img {
            width: 100px; height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #0d6efd;
            padding: 3px;
        }

        .nav-pills .nav-link { border-radius: 10px; font-weight: 600; color: #666; }
        .nav-pills .nav-link.active { background-color: #0d6efd; }

        /* Loading Overlay */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.8);
            display: none; justify-content: center; align-items: center; z-index: 9999;
        }

        footer { font-size: 0.7rem; text-align: center; padding: 15px; color: #888; margin-top: auto; }
    </style>
</head>
<body>

<div id="loader"><div class="spinner-border text-primary"></div></div>

<div class="container-fluid p-0">
    <!-- LAYER 1: LOGIN -->
    <div id="layer1" class="layer active justify-content-center">
        <div class="card-main p-4 mx-auto" style="max-width: 350px;">
            <div class="text-center mb-4">
                <h3 class="fw-bold text-primary">E-BENDAHARA</h3>
                <p class="text-muted small">Silakan masukkan PIN Anda</p>
            </div>
            <input type="password" id="pinInput" class="form-control form-control-lg text-center mb-3" 
                   placeholder="****" inputmode="numeric">
            <button onclick="attemptLogin()" class="btn btn-primary btn-lg w-100 fw-bold">MASUK</button>
        </div>
    </div>

    <!-- LAYER 2: ADMIN/BENDAHARA -->
    <div id="layer2" class="layer">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <small class="text-muted">Selamat Datang,</small>
                <h5 id="adminName" class="fw-bold mb-0">Admin</h5>
            </div>
            <button onclick="logout()" class="btn btn-sm btn-outline-danger">Keluar</button>
        </div>

        <ul class="nav nav-pills nav-fill mb-3 bg-white p-1 rounded-3 shadow-sm">
            <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#t-input">Input</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#t-rekap" onclick="loadAdminData()">Rekap</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#t-saldo">Saldo</button></li>
        </ul>

        <div class="tab-content">
            <div class="tab-pane fade show active" id="t-input">
                <div class="card-main p-3">
                    <label class="form-label small fw-bold">Nama Siswa</label>
                    <select id="selSiswa" class="form-select mb-3 shadow-none"></select>
                    
                    <label class="form-label small fw-bold">Kategori & Nominal</label>
                    <div class="row g-2 mb-3">
                        <div class="col-7"><select id="selKat" class="form-select"></select></div>
                        <div class="col-5"><input type="number" id="inpNom" class="form-control" placeholder="Rp"></div>
                    </div>
                    <button onclick="submitTransaksi()" class="btn btn-success w-100 fw-bold">SIMPAN DATA</button>
                </div>
            </div>
            
            <div class="tab-pane fade" id="t-rekap">
                <div class="card-main p-0 overflow-hidden">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0" style="font-size: 0.85rem;">
                            <thead class="table-light">
                                <tr><th>Siswa</th><th>KAS</th><th>GALON</th></tr>
                            </thead>
                            <tbody id="tableRekap"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- LAYER 3: SISWA -->
    <div id="layer3" class="layer">
        <div class="card-main p-4 text-center">
            <img id="sFoto" src="" class="profile-img mb-3" alt="Foto">
            <h5 id="sNama" class="fw-bold mb-1"></h5>
            <p id="sNISN" class="text-muted small mb-3"></p>
            
            <div class="row g-2 text-start">
                <div class="col-6">
                    <div class="p-2 bg-light rounded shadow-sm">
                        <small class="d-block text-success fw-bold border-bottom mb-1">LUNAS</small>
                        <div id="sLunas" style="font-size: 0.75rem;"></div>
                    </div>
                </div>
                <div class="col-6">
                    <div class="p-2 bg-light rounded shadow-sm">
                        <small class="d-block text-danger fw-bold border-bottom mb-1">SISA</small>
                        <div id="sKurang" style="font-size: 0.75rem;"></div>
                    </div>
                </div>
            </div>
            <button onclick="logout()" class="btn btn-danger w-100 mt-4">Keluar Sesi</button>
        </div>
    </div>

    <footer>
        Aplikasi e-bendahara v 1.2 (Build 15 Mei 2026)<br>
        Apps by MB © 2026 MB All Rights Reserved
    </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyKNBJl0DghHMSjW-I7BcqjVncZQlO-_UwcLqAJUcL-_R_FuIYUReTaSaRmMNEpimnQ/exec";

    // Cek Sesi saat aplikasi dibuka
    window.onload = function() {
        const savedSession = localStorage.getItem('ebendahara_session');
        if (savedSession) {
            const data = JSON.parse(savedSession);
            renderLayer(data);
        }
    };

    async function attemptLogin() {
        const pin = document.getElementById('pinInput').value;
        if (!pin) return;
        
        showLoader(true);
        try {
            // Kita gunakan JSONP trick untuk GAS
            const resp = await fetch(`${GAS_URL}?action=login&pin=${pin}`);
            const res = await resp.json();

            if (res.success) {
                localStorage.setItem('ebendahara_session', JSON.stringify(res));
                renderLayer(res);
            } else {
                alert("PIN Salah atau Tidak Terdaftar!");
            }
        } catch (e) {
            alert("Koneksi Error!");
        }
        showLoader(false);
    }

    function renderLayer(res) {
        document.querySelectorAll('.layer').forEach(l => l.classList.remove('active'));
        document.getElementById('layer' + res.layer).classList.add('active');
        
        if (res.layer === 2) {
            document.getElementById('adminName').innerText = res.name;
            loadAdminData(); // Menarik data dropdown & rekap
        } else if (res.layer === 3) {
            renderSiswaUI(res.dataSiswa);
        }
    }

    async function loadAdminData() {
        try {
            const resp = await fetch(`${GAS_URL}?action=getAdminData`);
            const data = await resp.json();
            
            // Render Dropdown Nama Siswa
            const selSiswa = document.getElementById('selSiswa');
            selSiswa.innerHTML = data.siswaList.map(s => `<option value="${s}">${s}</option>`).join('');
            
            // Render Dropdown Kategori (KAS, GALON, dll)
            const selKat = document.getElementById('selKat');
            selKat.innerHTML = data.targets.slice(1).map(t => `<option value="${t[0]}">${t[0]}</option>`).join('');
            
            // Render Tabel Rekap
            const table = document.getElementById('tableRekap');
            table.innerHTML = data.rekap.slice(1).map(r => `
                <tr>
                    <td class="fw-bold">${r[1]}</td>
                    <td>${r[2]}</td>
                    <td>${r[3]}</td>
                </tr>
            `).join('');
        } catch (e) { console.error("Gagal muat data admin"); }
    }

    function renderSiswaUI(d) {
        document.getElementById('sNama').innerText = d.nama;
        document.getElementById('sNISN').innerText = d.nisn;
        document.getElementById('sFoto').src = d.foto || "https://via.placeholder.com/150";
        document.getElementById('sLunas').innerHTML = d.rincianLunas.map(i => `<div>${i.kategori}: ${i.jumlah.toLocaleString()}</div>`).join('');
        document.getElementById('sKurang').innerHTML = d.rincianKurang.map(i => `<div>${i.kategori}: ${i.jumlah.toLocaleString()}</div>`).join('');
    }

    function logout() {
        localStorage.removeItem('ebendahara_session');
        location.reload();
    }

    function showLoader(v) { document.getElementById('loader').style.display = v ? 'flex' : 'none'; }
</script>
</body>
</html>
