<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>E-Bendahara</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',sans-serif;background:#f3f4f6;color:#111827;width:100%;max-width:600px;margin:auto;min-height:100vh}
.hidden{display:none !important}

.header{background:linear-gradient(135deg,#4f46e5,#7c3aed);padding:34px 20px;text-align:center;color:white}
.logo{font-size:42px;margin-bottom:6px}
.title{font-size:18px;font-weight:700}
.subtitle{font-size:12px;opacity:.9}

.container{padding:16px}
.card{background:white;border-radius:24px;padding:18px;margin-bottom:16px;box-shadow:0 4px 16px rgba(0,0,0,.06)}

input,select,button{width:100%;border:none;outline:none;border-radius:14px;padding:14px;font-size:14px;font-family:'Poppins'}
input,select{background:#f3f4f6;margin-top:10px}
button{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:white;font-weight:700;margin-top:14px;cursor:pointer}

.menu{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.menu button{background:white;color:#6b7280;border:1px solid #e5e7eb}
.menu button.active{background:linear-gradient(135deg,#7c3aed,#6d28d9);color:white;border:none}

.lunas{background:#dcfce7;color:#16a34a;padding:6px 10px;border-radius:999px;font-size:11px;font-weight:700}
.kurang{background:#fee2e2;color:#dc2626;padding:6px 10px;border-radius:999px;font-size:11px;font-weight:700}

.tableWrap{overflow:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:12px 8px;border-bottom:1px solid #e5e7eb;font-size:12px;text-align:center}
th{background:#fafafa}

.popup{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#16a34a;color:white;padding:14px 20px;border-radius:14px;z-index:999}
</style>
</head>

<body>

<div class="header">
  <div class="logo">💰</div>
  <div class="title">E-Bendahara</div>
  <div class="subtitle">Manajemen Keuangan Kelas Digital</div>
</div>

<!-- LOGIN -->
<div id="loginPage" class="container">
  <div class="card">
    <h3>Login</h3>
    <input id="pin" type="password" placeholder="PIN">
    <button onclick="login()">Masuk</button>
  </div>
</div>

<!-- ADMIN -->
<div id="adminPage" class="hidden container">

  <div class="card">
    <h3 id="namaAdmin"></h3>
  </div>

  <div class="card">
    <div class="menu">
      <button class="active" onclick="showMenu('rekap')">Rekap</button>
      <button onclick="showMenu('saldo')">Saldo</button>
      <button onclick="logout()">Logout</button>
    </div>
  </div>

  <div id="menuRekap" class="card">
    <table id="rekapTable"></table>
  </div>

  <div id="menuSaldo" class="card hidden"></div>

</div>

<!-- SISWA -->
<div id="siswaPage" class="hidden container">

  <div class="card">
    <h3 id="namaSiswa"></h3>
  </div>

  <div class="card">
    <div id="sudahBayar"></div>
  </div>

  <div class="card">
    <div id="belumBayar"></div>
  </div>

  <button onclick="logout()">Logout</button>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbyKNBJl0DghHMSjW-I7BcqjVncZQlO-_UwcLqAJUcL-_R_FuIYUReTaSaRmMNEpimnQ/exec";

let DASHBOARD = {};

async function post(data){
  const r = await fetch(API_URL,{method:"POST",body:JSON.stringify(data)});
  return r.json();
}

function popup(t){
  const d=document.createElement("div");
  d.className="popup";
  d.innerHTML=t;
  document.body.appendChild(d);
  setTimeout(()=>d.remove(),2000);
}

/* ================= LOGIN ================= */
async function login(){
  const pin=document.getElementById("pin").value;

  const res=await post({action:"login",pin});

  if(!res.success){
    popup("PIN salah");
    return;
  }

  localStorage.setItem("pin",pin);

  if(res.role==="SISWA"){
    loadSiswa(pin);
  }else{
    loadDashboard();
  }
}

/* ================= DASHBOARD ADMIN ================= */
async function loadDashboard(){

  const res=await post({action:"getDashboard"});
  DASHBOARD=res;

  document.getElementById("loginPage").classList.add("hidden");
  document.getElementById("adminPage").classList.remove("hidden");

  document.getElementById("namaAdmin").innerText="ADMIN";

  renderRekap();
}

function renderRekap(){

  let html="<tr><th>Nama</th>";

  DASHBOARD.target.forEach(t=>{
    html+=`<th>${t.kategori}</th>`;
  });

  html+="</tr>";

  DASHBOARD.rekap.slice(1).forEach(row=>{
    html+="<tr>";

    row.forEach((cell,i)=>{

      if(i===0){
        html+=`<td style="text-align:left">${cell}</td>`;
      }else{

        if(cell==="LUNAS"){
          html+=`<td><span class="lunas">LUNAS</span></td>`;
        }else{
          html+=`<td><span class="kurang">Rp${Number(cell).toLocaleString('id-ID')}</span></td>`;
        }

      }

    });

    html+="</tr>";
  });

  document.getElementById("rekapTable").innerHTML=html;
}

/* ================= SISWA ================= */
async function loadSiswa(pin){

  const res=await post({action:"getSiswaDashboard",nisn:pin});

  if(!res.success){
    popup("Tidak ditemukan");
    return;
  }

  document.getElementById("loginPage").classList.add("hidden");
  document.getElementById("siswaPage").classList.remove("hidden");

  document.getElementById("namaSiswa").innerText=res.siswa.nama;

  let bayar="",kurang="";

  Object.keys(res.bayar).forEach(k=>{
    bayar+=`<div>${k}: Rp${res.bayar[k].toLocaleString('id-ID')}</div>`;
  });

  Object.keys(res.kurang).forEach(k=>{
    const v=res.kurang[k];
    kurang+=`<div>${k}: ${v===0?'<span style="color:green">LUNAS</span>':'Rp'+v.toLocaleString('id-ID')}</div>`;
  });

  document.getElementById("sudahBayar").innerHTML=bayar;
  document.getElementById("belumBayar").innerHTML=kurang;
}

/* ================= LOGOUT ================= */
function logout(){
  localStorage.clear();
  location.reload();
}

/* ================= AUTO LOGIN FIX ================= */
window.onload=()=>{
  const pin=localStorage.getItem("pin");
  if(pin) login();
}

</script>

</body>
</html>
