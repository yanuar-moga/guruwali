<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body { background: #f8f9fa; padding: 15px; }
    .card { border-radius: 12px; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .status-LUNAS { background-color: #d1e7dd; color: #0f5132; font-weight: bold; padding: 2px 8px; border-radius: 5px; }
    .status-BELUM { background-color: #f8d7da; color: #842029; font-weight: bold; padding: 2px 8px; border-radius: 5px; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div id="loginPage" class="container" style="max-width: 400px; margin-top: 50px;">
    <div class="card p-4">
      <h4 class="text-center mb-4">🔑 Login Iuran 7H</h4>
      <input type="tel" id="pin" class="form-control mb-3 text-center" placeholder="Masukkan PIN" style="font-size: 24px; letter-spacing: 5px;">
      <button onclick="doLogin()" id="btnLogin" class="btn btn-primary w-100 py-2">MASUK</button>
    </div>
  </div>

  <div id="mainPage" class="container hidden">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 id="userDisplay">Halo...</h5>
      <button onclick="location.reload()" class="btn btn-sm btn-outline-danger">Logout</button>
    </div>

    <!-- FORM BENDAHARA -->
    <div id="inputForm" class="card p-3 hidden">
      <h6>➕ Input Iuran Baru</h6>
      <div class="row g-2">
        <div class="col-12">
          <select id="siswa" class="form-select"></select>
        </div>
        <div class="col-6">
          <select id="jenis" class="form-select">
            <option value="GALON">GALON</option>
            <option value="KARTU_PELAJAR">KARTU PELAJAR</option>
            <option value="TALI_ASIH">TALI ASIH</option>
            <option value="OTHER">LAINNYA</option>
            <option value="KAS_KELAS">KAS KELAS</option>
          </select>
        </div>
        <div class="col-6">
          <input type="number" id="jumlah" class="form-control" placeholder="Rp">
        </div>
        <button onclick="simpan()" id="btnSimpan" class="btn btn-success mt-2">SIMPAN DATA</button>
      </div>
    </div>

    <!-- TABEL REKAP -->
    <div class="card p-3">
      <h6>📊 Rekapitulasi Terakhir</h6>
      <div class="table-responsive">
        <table class="table table-sm table-striped" id="tabelRekap" style="font-size: 12px;">
          <thead class="table-dark"></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    function doLogin() {
      const pin = document.getElementById('pin').value;
      document.getElementById('btnLogin').disabled = true;
      google.script.run.withSuccessHandler(res => {
        if(res.status === "success") {
          document.getElementById('loginPage').classList.add('hidden');
          document.getElementById('mainPage').classList.remove('hidden');
          document.getElementById('userDisplay').innerText = "👤 " + res.user;
          if(res.role === "BENDAHARA") {
            document.getElementById('inputForm').classList.remove('hidden');
            loadSiswa();
          }
          loadRekap();
        } else {
          alert(res.message);
          document.getElementById('btnLogin').disabled = false;
        }
      }).checkLogin(pin);
    }

    function loadSiswa() {
      google.script.run.withSuccessHandler(list => {
        const sel = document.getElementById('siswa');
        list.forEach(s => sel.innerHTML += `<option value="${s}">${s}</option>`);
      }).getSiswaList();
    }

    function simpan() {
      const btn = document.getElementById('btnSimpan');
      const data = {
        nama: document.getElementById('siswa').value,
        jenis: document.getElementById('jenis').value,
        jumlah: document.getElementById('jumlah').value,
        user: document.getElementById('userDisplay').innerText
      };
      if(!data.jumlah) return alert("Isi nominal!");
      btn.disabled = true;
      google.script.run.withSuccessHandler(() => {
        alert("Berhasil!");
        document.getElementById('jumlah').value = "";
        btn.disabled = false;
        loadRekap();
      }).simpanIuran(data);
    }

    function loadRekap() {
      google.script.run.withSuccessHandler(data => {
        const thead = document.querySelector('#tabelRekap thead');
        const tbody = document.querySelector('#tabelRekap tbody');
        thead.innerHTML = `<tr>${data[0].map(h => `<th>${h}</th>`).join('')}</tr>`;
        tbody.innerHTML = data.slice(1).map(row => 
          `<tr>${row.map(c => `<td><span class="status-${c}">${c}</span></td>`).join('')}</tr>`
        ).join('');
      }).getRekapData();
    }
  </script>
</body>
</html>
