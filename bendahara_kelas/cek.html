<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Bendahara Kelas 7H</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <style>
    :root {
      --primary-color: #4f46e5;
      --secondary-color: #7c3aed;
      --bg-light: #f8fafc;
    }
    body { font-family: 'Poppins', sans-serif; background-color: var(--bg-light); color: #334155; min-height: 100vh; display: flex; flex-direction: column; }
    .header-app { background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%); color: white; padding: 35px 20px; text-align: center; border-radius: 0 0 30px 30px; box-shadow: 0 4px 15px rgba(79,70,229,0.3); }
    .container { max-width: 700px; padding: 20px; flex: 1; }
    .card { border: none; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.03); margin-bottom: 20px; }
    .btn-primary { background: var(--primary-color); border: none; padding: 12px; border-radius: 12px; font-weight: 600; transition: 0.3s; }
    .btn-primary:hover { background: #4338ca; transform: translateY(-2px); }
    .hidden { display: none !important; }
    .pin-input { letter-spacing: 8px; text-align: center; font-size: 1.5rem; font-weight: bold; border-radius: 12px; border: 2px solid #e2e8f0; }
    .status-badge { font-size: 0.7rem; padding: 4px 10px; border-radius: 10px; font-weight: 600; }
    .bg-lunas { background-color: #dcfce7; color: #15803d; }
    .bg-sisa { background-color: #fee2e2; color: #b91c1c; }
    .footer { text-align: center; padding: 20px; font-size: 0.75rem; color: #94a3b8; }
    
    /* Profile Card Styling */
    .profile-siswa-card { background: white; border-radius: 20px; padding: 20px; border-top: 5px solid var(--primary-color); }
    .detail-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #e2e8f0; font-size: 0.9rem; }
    .rincian-box { background: white; border-radius: 15px; padding: 15px; margin-top: 10px; border-left: 4px solid var(--secondary-color); box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
  </style>
</head>
<body>

  <div class="header-app">
    <h3 class="mb-0">💰 E-Bendahara 7H</h3>
    <p class="small opacity-75 mb-0">SMP Negeri 1 Moga</p>
  </div>

  <div class="container">
    <!-- 1. LOGIN SECTION -->
    <div id="loginSection" class="card p-4 shadow-sm">
      <div class="text-center mb-4">
        <h5 class="fw-bold">Akses Sistem</h5>
        <p class="text-muted small">Wali Kelas/Bendahara: Masukkan PIN<br>Siswa: Masukkan NISN</p>
      </div>
      <input type="password" id="pinInput" class="form-control pin-input mb-3" placeholder="••••••" inputmode="numeric">
      <button onclick="login()" id="btnLogin" class="btn btn-primary w-100 shadow">MASUK</button>
    </div>

    <!-- 2. MAIN PANEL -->
    <div id="mainSection" class="hidden">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <span class="badge bg-primary-subtle text-primary mb-1" id="roleLabel"></span>
          <h5 class="fw-bold mb-0" id="userNameLabel"></h5>
        </div>
        <button onclick="logout()" class="btn btn-outline-danger btn-sm rounded-pill px-3">Keluar</button>
      </div>

      <!-- NAVIGASI ADMIN -->
      <ul id="navAdmin" class="nav nav-pills nav-fill mb-4 card p-2 flex-row shadow-sm bg-white">
        <li class="nav-item"><button class="nav-link active" id="tabInBtn" onclick="showTab('input')">Input</button></li>
        <li class="nav-item"><button class="nav-link" id="tabRekapBtn" onclick="loadRekap()">Rekap</button></li>
        <li class="nav-item"><button class="nav-link" id="tabTotalBtn" onclick="loadTotalDana()">Saldo</button></li>
      </ul>

      <!-- PANEL KHUSUS SISWA -->
      <div id="panelSiswa" class="hidden">
        <div id="siswaResultContainer"></div>
      </div>

      <!-- CONTENT AREAS (ADMIN/BENDAHARA) -->
      <div id="tabInput" class="card p-3 shadow-sm">
        <div class="d-flex gap-2 mb-3">
          <button id="modeIuran" onclick="switchMode('iuran')" class="btn btn-sm btn-primary flex-fill rounded-pill">Iuran Siswa</button>
          <button id="modeSetor" onclick="switchMode('setor')" class="btn btn-sm btn-outline-danger flex-fill rounded-pill">Setor Kesiswaan</button>
        </div>
        
        <div id="areaIuran">
          <label class="small fw-bold text-muted mb-2">Pilih Nama Siswa:</label>
          <select id="siswaSelect" class="form-select mb-3 border-0 bg-light py-2"></select>
          <div class="table-responsive">
            <table class="table table-borderless align-middle small">
              <tbody id="inputTableBody"></tbody>
            </table>
          </div>
        </div>

        <div id="areaSetor" class="hidden py-3 text-center">
          <label class="small fw-bold">Nominal Setor ke Kesiswaan</label>
          <input type="number" id="nominalSetor" class="form-control form-control-lg text-center mt-2" placeholder="Rp 0">
        </div>

        <button onclick="prosesSimpan()" id="btnSimpan" class="btn btn-primary w-100 mt-3 shadow">SIMPAN TRANSAKSI</button>
      </div>

      <!-- TAB REKAP -->
      <div id="tabRekap" class="hidden">
        <div class="card p-0 overflow-hidden">
          <div class="table-responsive">
            <table class="table align-middle mb-0" id="tableRekap" style="font-size: 0.7rem;"></table>
          </div>
        </div>
      </div>

      <!-- TAB SALDO -->
      <div id="tabTotal" class="hidden">
        <div id="totalDanaContainer"></div>
      </div>
    </div>
  </div>

  <div class="footer">E-Bendahara System &copy; 2026 - Spensamo</div>

  <script>
    // GANTI DENGAN URL WEB APP GAS ANDA
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyt3p4O8Wbjwlg1ILlq7PMvYUA2na3TWcaMB54PEH11zHw9rBRoKOI4nnTRFz8pdURNZQ/exec";
    
    let role = "", namaUser = "", sessionID = "", userAbsen = "", currentMode = "iuran";

    window.onload = checkSession;

    function checkSession() {
      const saved = localStorage.getItem("ebendahara_session");
      if (saved) {
        const d = JSON.parse(saved);
        role = d.role; namaUser = d.nama; sessionID = d.sessionID; userAbsen = d.absen;
        renderUI();
      }
    }

    async function login() {
      const pin = document.getElementById('pinInput').value;
      if(!pin) return;
      const btn = document.getElementById('btnLogin');
      btn.disabled = true; btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Loading...';

      try {
        const res = await fetch(GAS_URL, { 
          method: "POST", 
          body: JSON.stringify({ action: "login", pin: pin }) 
        });
        const d = await res.json();

        if(d.status === "success" && d.data) {
          localStorage.setItem("ebendahara_session", JSON.stringify(d.data));
          role = d.data.role; namaUser = d.data.nama; userAbsen = d.data.absen;
          renderUI();
        } else {
          Swal.fire('Gagal', 'PIN atau NISN tidak valid.', 'error');
          btn.disabled = false; btn.innerText = 'MASUK';
        }
      } catch (e) {
        Swal.fire('Error', 'Koneksi bermasalah.', 'error');
        btn.disabled = false;
      }
    }

    function renderUI() {
      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('mainSection').classList.remove('hidden');
      document.getElementById('roleLabel').innerText = role;
      document.getElementById('userNameLabel').innerText = namaUser;

      if (role === "SISWA") {
        document.getElementById('navAdmin').classList.add('hidden');
        document.getElementById('tabInput').classList.add('hidden');
        document.getElementById('panelSiswa').classList.remove('hidden');
        loadDataSiswa(); 
      } else {
        initAdminData();
      }
    }

    async function loadDataSiswa() {
      const container = document.getElementById('siswaResultContainer');
      container.innerHTML = '<div class="text-center p-5"><div class="spinner-border text-primary"></div><p class="mt-2">Mengambil data...</p></div>';
      
      try {
        const res = await fetch(GAS_URL, { 
          method: "POST", 
          body: JSON.stringify({ action: "rekap", role: "SISWA", absen: userAbsen }) 
        });
        const d = await res.json();
        
        if(d.status === "success" && d.data.rekap.length > 0) {
          const s = d.data.rekap[0];
          let html = `
            <div class="profile-siswa-card shadow-sm mb-4">
              <h6 class="fw-bold border-bottom pb-2">DATA PROFIL</h6>
              <div class="detail-item"><span>Nama</span><span class="fw-600">${s.nama}</span></div>
              <div class="detail-item"><span>No. Absen</span><span>${s.absen}</span></div>
              <div class="detail-item"><span>L/P</span><span>${s.jenisKelamin || '-'}</span></div>
              <div class="detail-item"><span>NISN</span><span>${s.nisn || '-'}</span></div>
              <div class="mt-3 p-3 bg-primary text-white rounded-3 text-center">
                <small>Total Terbayar</small>
                <h3 class="mb-0 fw-bold text-warning">Rp ${s.totalBayar.toLocaleString()}</h3>
              </div>
            </div>
            <h6 class="fw-bold mb-3">RINCIAN IURAN:</h6>
          `;
          
          s.rincian.forEach(item => {
            const isLunas = item.status === "LUNAS";
            html += `
              <div class="rincian-box d-flex justify-content-between align-items-center">
                <div>
                  <small class="text-muted d-block">${item.kategori}</small>
                  <span class="fw-bold">Rp ${item.bayar.toLocaleString()}</span> 
                  <span class="text-muted" style="font-size:0.8rem">/ Rp ${item.target.toLocaleString()}</span>
                </div>
                <span class="status-badge ${isLunas ? 'bg-lunas' : 'bg-sisa'}">${item.status}</span>
              </div>
            `;
          });
          container.innerHTML = html;
        }
      } catch(e) { container.innerHTML = "Gagal memuat data."; }
    }

    async function initAdminData() {
      const cats = ["KAS", "GALON", "KARTU PELAJAR", "TALI ASIH", "LAIN 1", "LAIN 2"];
      document.getElementById('inputTableBody').innerHTML = cats.map(k => `
        <tr>
          <td class="fw-bold" width="40%">${k}</td>
          <td><input type="number" class="form-control form-control-sm iuran-input" data-kat="${k}" placeholder="Rp 0"></td>
        </tr>
      `).join('');

      const res = await fetch(GAS_URL, { 
        method: "POST", 
        body: JSON.stringify({ action: "getInitialData", role: role }) 
      });
      const d = await res.json();
      if(d.data) {
        document.getElementById('siswaSelect').innerHTML = d.data.siswa
          .filter(s => s[1])
          .map(s => `<option value="${s[0]}">${s[0]}. ${s[1]}</option>`).join('');
      }
    }

    async function loadRekap() {
      showTab('rekap');
      const t = document.getElementById('tableRekap');
      t.innerHTML = '<tr><td class="p-4 text-center"><div class="spinner-border spinner-border-sm"></div></td></tr>';
      
      const res = await fetch(GAS_URL, { 
        method: "POST", 
        body: JSON.stringify({ action: "rekap", role: role }) 
      });
      const d = await res.json();
      
      if(d.data) {
        let h = `<thead class="table-light"><tr><th class="ps-3">Nama</th>` + d.data.kategori.map(k => `<th class="text-center">${k.substring(0,3)}</th>`).join('') + `</tr></thead><tbody>`;
        d.data.rekap.forEach(r => {
          h += `<tr><td class="ps-3 fw-bold">${r.nama.split(' ')[0]}</td>`;
          r.rincian.forEach(rin => {
            const isLunas = rin.status === 'LUNAS';
            h += `<td class="text-center"><span class="status-badge ${isLunas?'bg-lunas':'bg-sisa'}">${isLunas ? '✔' : '✘'}</span></td>`;
          });
          h += `</tr>`;
        });
        t.innerHTML = h + "</tbody>";
      }
    }

    async function loadTotalDana() {
      showTab('total');
      const container = document.getElementById('totalDanaContainer');
      container.innerHTML = '<div class="text-center p-3"><div class="spinner-border"></div></div>';
      
      const res = await fetch(GAS_URL, { method: "POST", body: JSON.stringify({ action: "totalDana" }) });
      const d = await res.json();
      
      if(d.data) {
        let html = '<div class="row g-2">';
        let totalNet = 0;
        for (let kat in d.data) {
          if (kat !== "SETOR KESISWAAN") totalNet += d.data[kat];
          else totalNet -= d.data[kat];

          html += `
            <div class="col-6">
              <div class="card p-3 text-center shadow-sm">
                <p class="small text-muted mb-1" style="font-size:0.65rem">${kat}</p>
                <h6 class="fw-bold mb-0" style="font-size:0.9rem">Rp ${d.data[kat].toLocaleString()}</h6>
              </div>
            </div>
          `;
        }
        html += `
          <div class="col-12 mt-2">
            <div class="card p-3 text-center bg-dark text-white shadow">
              <p class="small mb-1 text-warning">SALDO KAS (DI TANGAN)</p>
              <h3 class="fw-bold mb-0 text-success">Rp ${totalNet.toLocaleString()}</h3>
            </div>
          </div>
        </div>`;
        container.innerHTML = html;
      }
    }

    async function prosesSimpan() {
      const btn = document.getElementById('btnSimpan');
      const items = [];

      if (currentMode === 'iuran') {
        document.querySelectorAll('.iuran-input').forEach(inp => {
          if(inp.value && inp.value != 0) {
            items.push({ kategori: inp.getAttribute('data-kat'), jumlah: inp.value });
          }
        });
      } else {
        const nominal = document.getElementById('nominalSetor').value;
        if(nominal && nominal != 0) {
          items.push({ kategori: "SETOR KESISWAAN", jumlah: nominal });
        }
      }

      if (items.length === 0) return Swal.fire('Opps', 'Isi nominal dulu!', 'warning');

      const payload = {
        action: "saveMulti",
        role: role,
        namaUser: namaUser,
        data: {
          absenSiswa: currentMode === 'iuran' ? document.getElementById('siswaSelect').value : "0",
          namaSiswa: currentMode === 'iuran' ? document.getElementById('siswaSelect').options[document.getElementById('siswaSelect').selectedIndex].text.split('. ')[1] : "KESISWAAN",
          items: items
        }
      };

      btn.disabled = true; btn.innerText = 'Menyimpan...';
      try {
        const res = await fetch(GAS_URL, { method: "POST", body: JSON.stringify(payload) });
        const d = await res.json();

        if(d.status === "success") {
          Swal.fire('Berhasil', 'Data transaksi berhasil disimpan.', 'success').then(() => {
            // Reset input
            document.querySelectorAll('.iuran-input').forEach(i => i.value = "");
            document.getElementById('nominalSetor').value = "";
            btn.disabled = false; btn.innerText = 'SIMPAN TRANSAKSI';
          });
        } else {
          Swal.fire('Gagal', d.message, 'error');
          btn.disabled = false; btn.innerText = 'SIMPAN TRANSAKSI';
        }
      } catch (e) {
        Swal.fire('Error', 'Gagal kirim data.', 'error');
        btn.disabled = false;
      }
    }

    function switchMode(m) {
      currentMode = m;
      document.getElementById('areaIuran').classList.toggle('hidden', m !== 'iuran');
      document.getElementById('areaSetor').classList.toggle('hidden', m !== 'setor');
      document.getElementById('modeIuran').className = m === 'iuran' ? 'btn btn-sm btn-primary flex-fill rounded-pill' : 'btn btn-sm btn-outline-primary flex-fill rounded-pill';
      document.getElementById('modeSetor').className = m === 'setor' ? 'btn btn-sm btn-danger flex-fill rounded-pill' : 'btn btn-sm btn-outline-danger flex-fill rounded-pill';
    }

    function showTab(t) {
      ['tabInput','tabRekap','tabTotal'].forEach(id => {
        document.getElementById(id).classList.toggle('hidden', id !== 'tab'+t.charAt(0).toUpperCase()+t.slice(1));
      });
      document.querySelectorAll('#navAdmin .nav-link').forEach(btn => btn.classList.remove('active'));
      document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1) + 'Btn').classList.add('active');
    }

    function logout() {
      localStorage.removeItem("ebendahara_session");
      location.reload();
    }
  </script>
</body>
</html>
